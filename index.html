<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15202b;background:#eef2f6}*{box-sizing:border-box}body{margin:0;overscroll-behavior:none}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;font-weight:900}.top{position:sticky;top:0;z-index:40;background:#083a73;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}.title{font-size:19px;font-weight:900}.gpsline{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:12px}.badge{background:#ffffff22;border:1px solid #ffffff33;border-radius:999px;padding:4px 8px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-top:7px}.toolbar input{min-width:0;border:0;border-radius:10px;padding:10px}.toolbar button{padding:10px 12px;background:#fff;color:#083a73}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100vh - 120px)}.map-shell{position:relative;overflow:auto;background:#616b75;-webkit-overflow-scrolling:touch}.map{position:relative;width:1800px;line-height:0;background:#fff}.map img{display:block;width:100%;height:auto}.pins,.gps-layer{position:absolute;inset:0;pointer-events:none}.pin{pointer-events:auto;position:absolute;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;background:#747e88;color:#fff;line-height:16px;text-align:center;font-size:7px;font-weight:900;box-shadow:0 1px 5px #0008}.pin.known{background:#16803d}.pin.picked{background:#7b3fc6}.pin.done{background:#16803d}.pin.ncr-open{background:#c32727}.pin.ncr-pending{background:#ff9f0a}.pin.ncr-cleared{background:#16803d}.pin.nearest{width:34px;height:34px;line-height:30px;font-size:11px;background:#ff9f0a;z-index:8}.pin.selected{outline:4px solid #fff9;z-index:9}.blue-dot{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);border-radius:50%;background:#0a84ff;border:4px solid #fff;box-shadow:0 1px 9px #0009;z-index:15}.accuracy{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:#0a84ff20;border:1px solid #0a84ff80;z-index:12}.panel{background:#fff;border-left:1px solid #cbd3dc;padding:10px;overflow:auto}.card{border:1px solid #d7dee7;border-radius:14px;padding:12px;margin-bottom:10px}.card h2{margin:0 0 7px;font-size:22px}.statusrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.pill{border-radius:999px;background:#edf1f5;padding:5px 8px;font-size:12px;font-weight:900}.pill.blue{background:#dceeff;color:#0058a8}.pill.green{background:#dff4e5;color:#12642f}.big-actions{display:grid;gap:9px}.action{width:100%;min-height:58px;font-size:20px;color:#fff}.pickup{background:#7b3fc6}.unload{background:#16803d}.photo{background:#0b67c2}.next{background:#e7edf4;color:#16202a}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools button{padding:12px;background:#e7edf4;color:#16202a}.label{font-size:12px;color:#66717c;margin:9px 0 4px;display:block}.field{width:100%;border:1px solid #c8d0d9;border-radius:10px;padding:10px}.tiny{font-size:12px;color:#687480}.notice{background:#fff4cc;border:1px solid #f0cc55;border-radius:10px;padding:9px;font-size:12px}
.ncr-card{border:2px solid #d49300;background:#fff8df;border-radius:12px;padding:10px;margin:8px 0}
.ncr-card.closed{border-color:#16803d;background:#eaf8ee}
.ncr-title{font-size:16px;font-weight:900;display:flex;justify-content:space-between;gap:8px}
.ncr-status{border-radius:999px;padding:3px 8px;font-size:11px;background:#ffe4a3}
.ncr-card.closed .ncr-status{background:#ccebd5;color:#12642f}
.share-log{background:#b42318!important;color:#fff!important;grid-column:1/-1;font-size:18px;min-height:54px}
.ncr-import{background:#7b3fc6!important;color:#fff!important}.ncr-manual{margin-top:8px;padding-top:8px;border-top:1px dashed #caa43c}.empty{text-align:center;color:#6d7883;padding:25px 8px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;background:#111;color:#fff;padding:11px 15px;border-radius:11px;font-weight:800;box-shadow:0 4px 20px #0007}.legend{position:fixed;left:9px;bottom:9px;z-index:20;background:#fffe;padding:7px 9px;border-radius:10px;font-size:11px;box-shadow:0 2px 10px #0003}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px}@media(max-width:760px){.top{position:relative}.layout{display:block;height:auto}.map-shell{height:57vh}.map{width:1500px}.panel{border-left:0;border-top:1px solid #ccd4dd;min-height:43vh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.legend{bottom:44vh}.action{min-height:62px}}
</style>
<style>
.map-wrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:#616b75}.map-shell{width:100%;height:100%;overscroll-behavior:contain;touch-action:pan-x pan-y}
.map-controls{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:25;width:max-content;display:flex;flex-direction:column;gap:6px;padding:6px;background:#fffffff2;border-radius:14px;box-shadow:0 2px 12px #0005;line-height:normal}
.map-controls button{min-width:42px;min-height:42px;padding:7px 10px;background:#083a73;color:#fff;border-radius:9px;font-size:18px;touch-action:manipulation}
.map-controls button.map-reset{font-size:11px;min-width:48px}.map-controls button.map-center{font-size:21px}@media(max-width:760px){.map-wrap{height:57vh}.map-shell{height:100%}.legend{max-width:calc(100% - 74px)}}
.map .legend{position:absolute;left:10px;bottom:10px;z-index:20;max-width:520px;line-height:1.35}

.pin.type-tieback{border-radius:4px}.pin.type-footing{border-radius:2px}.pin.type-column{border-radius:50% 50% 4px 4px}.pin.type-ers{border-style:double;border-width:4px}.pin.type-custom{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border-radius:0}.item-setup{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item-setup button{grid-column:1/-1}@media(max-width:420px){.item-setup{grid-template-columns:1fr}}
#itemFilter{color:#fff}#itemFilter option{color:#111}
.toolbar{grid-template-columns:minmax(0,1fr) auto auto auto}.project-list{display:grid;gap:8px}.project-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid #d7dee7;border-radius:12px;padding:10px}.project-row button{padding:10px;background:#083a73;color:#fff}.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.module-grid button{padding:14px;background:#e7edf4;color:#16202a}.project-form{display:grid;gap:8px}@media(max-width:420px){.toolbar{grid-template-columns:minmax(0,1fr) auto auto}.toolbar #projectsBtn{grid-column:1/-1}.module-grid{grid-template-columns:1fr}}
@media(max-width:760px){.pin{width:32px;height:32px;line-height:27px;font-size:11px;border-width:3px;box-shadow:0 2px 7px #0009}.pin.nearest{width:46px;height:46px;line-height:40px;font-size:15px}.pin.selected{outline-width:5px}}
.dashboard-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.metric{background:#eef3f8;border-radius:12px;padding:12px;text-align:center}.metric b{display:block;font-size:26px;color:#083a73}.metric span{font-size:12px;color:#596775}.warning-list{margin:8px 0;padding-left:20px}.warning-list li{margin:5px 0}.dashboard-action{width:100%;padding:13px;margin-top:8px;background:#083a73;color:#fff}.dashboard-print{background:#b42318}.dashboard-back{background:#e7edf4;color:#16202a}.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check-grid label{font-size:12px;font-weight:800;color:#53606c}.check-grid select{margin-top:4px}@media(max-width:420px){.check-grid{grid-template-columns:1fr}}
</style>

<body>
<header class="top"><div class="title">FieldVerify Pro <span style="font-size:11px;opacity:.75">v7 stable</span></div><div class="gpsline"><span id="projectStatus" class="badge">Project loading…</span><span id="gpsStatus" class="badge">GPS off</span><span id="accuracyStatus" class="badge">Accuracy —</span><span id="targetStatus" class="badge">No target</span><span id="networkStatus" class="badge">Checking connection…</span><select id="itemFilter" class="badge" aria-label="Filter item type"><option value="">All item types</option><option>Caisson</option><option>ERS</option><option>Tieback</option><option>Footing</option><option>Column</option><option>Custom</option></select></div><div class="toolbar"><input id="search" type="text" autocapitalize="characters" placeholder="Item number or ID"><button id="find">Find</button><button id="locate">Start GPS</button><button id="projectsBtn">Projects</button></div></header>
<div class="layout"><section class="map-wrap"><div class="map-controls" aria-label="Stationary map controls"><button id="zoomIn" aria-label="Zoom in">&#43;</button><button id="mapCenter" class="map-center" aria-label="Center map">&#9678;</button><button id="zoomReset" class="map-reset">Fit</button><button id="zoomOut" aria-label="Zoom out">&minus;</button></div><div class="map-shell" id="mapShell"><div class="map" id="map"><img id="planImage" src="caisson-plan.png" alt="Foundation inspection drawing"><div class="pins" id="pins"></div><div class="gps-layer" id="gpsLayer"></div><div class="legend"><span class="dot" style="background:#0a84ff"></span>You &nbsp;<span class="dot" style="background:#c32727"></span>NCR Open &nbsp;<span class="dot" style="background:#ff9f0a"></span>NCR Pending / Next &nbsp;<span class="dot" style="background:#7b3fc6"></span>Started &nbsp;<span class="dot" style="background:#16803d"></span>Cleared / Completed</div></div></div></section><aside class="panel" id="panel"><div class="empty">Loading inspection drawing…</div></aside></div>
<input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment" multiple>
<input id="libraryInput" class="hidden" type="file" accept="image/*" multiple>
<input id="restoreInput" class="hidden" type="file" accept="application/json,.json,application/pdf,.pdf">
<input id="ncrExcelInput" class="hidden" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
<input id="ncrPdfInput" class="hidden" type="file" accept="application/pdf,.pdf">
<input id="drawingInput" class="hidden" type="file" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp,image/gif">

<script>
const OLD_KEY='ordCaissonRecords',NEW_KEY='foundationInspectorRecords',NCR_KEY='foundationInspectorNcrData';
const PROJECTS_KEY='fieldVerifyProjects',ACTIVE_PROJECT_KEY='fieldVerifyActiveProject';
const ITEM_TYPES=['Caisson','ERS','Tieback','Footing','Column','Custom'];
let HOTSPOTS=[],records={},ncrRows=[],projects=[],activeProjectId='legacy',selected=null,nearest=null,watchId=null,refreshTimer=null,transform=null,lastPosition=null,bestPosition=null,gpsSamples=[],lastGoodAt=0,autoCenter=true,pendingNcrPdfId=null;
let mapBaseWidth=window.matchMedia('(max-width:760px)').matches?1500:1800,mapWidth=mapBaseWidth,pinchStart=null,pinchFrame=null,pinchPending=null;
const $=id=>document.getElementById(id),num=v=>{const n=Number(v);return Number.isFinite(n)?n:null},esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':'&quot;'}[m]));
function defaultRec(){return{itemType:'Caisson',itemLabel:'',status:'No information',verified:false,notes:'',lat:null,lon:null,condition:'',updated:'',photos:[],pickupTime:null,unloadTime:null,pickupGPS:null,unloadGPS:null}}
function rec(n){return{...defaultRec(),...(records[n]||{})}}
function itemType(r){return ITEM_TYPES.includes(r?.itemType)?r.itemType:'Caisson'}
function itemName(n,r=rec(n)){return String(r.itemLabel||'').trim()||`${itemType(r)} ${n}`}
function pinLabel(n,r=rec(n)){const custom=String(r.itemLabel||'').trim();return custom?(custom.length>6?custom.slice(0,5)+'…':custom):String(n)}
function currentFilter(){return $('itemFilter')?.value||''}
function projectRecordsKey(id=activeProjectId){return`fieldVerifyProjectRecords:${id}`}
function projectNcrKey(id=activeProjectId){return`fieldVerifyProjectNcr:${id}`}
function activeProject(){return projects.find(p=>p.id===activeProjectId)||projects[0]}
function saveProjects(){localStorage.setItem(PROJECTS_KEY,JSON.stringify(projects));localStorage.setItem(ACTIVE_PROJECT_KEY,activeProjectId);const p=activeProject();if($('projectStatus'))$('projectStatus').textContent=p?.name||'No project'}
function initializeProjects(){try{projects=JSON.parse(localStorage.getItem(PROJECTS_KEY)||'[]')}catch{projects=[]}if(!Array.isArray(projects)||!projects.length){projects=[{id:'legacy',name:'Existing Foundation Project',number:'',address:'',client:'',drawingRevision:'',created:new Date().toISOString()}]}activeProjectId=localStorage.getItem(ACTIVE_PROJECT_KEY)||projects[0].id;if(!projects.some(p=>p.id===activeProjectId))activeProjectId=projects[0].id;saveProjects()}
function loadRecords(){
 try{
   const saved=localStorage.getItem(projectRecordsKey());
   records=saved?JSON.parse(saved):(activeProjectId==='legacy'?{...JSON.parse(localStorage.getItem(OLD_KEY)||'{}'),...JSON.parse(localStorage.getItem(NEW_KEY)||'{}')}:{ });
   const savedNcr=localStorage.getItem(projectNcrKey());ncrRows=savedNcr?JSON.parse(savedNcr):(activeProjectId==='legacy'?JSON.parse(localStorage.getItem(NCR_KEY)||'[]'):[]);
   if(!Array.isArray(ncrRows))ncrRows=[];
 }catch{records={};ncrRows=[]}
 persist()
}
function persist(){localStorage.setItem(projectRecordsKey(),JSON.stringify(records));if(activeProjectId==='legacy')localStorage.setItem(NEW_KEY,JSON.stringify(records));renderPins();fitTransform()}
function persistNcr(){localStorage.setItem(projectNcrKey(),JSON.stringify(ncrRows));if(activeProjectId==='legacy')localStorage.setItem(NCR_KEY,JSON.stringify(ncrRows))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.add('hidden'),2400)}
async function loadHotspots(){
  $('panel').innerHTML='<div class="empty">Loading drawing and inspection locations…</div>';
  const data=window.FOUNDATION_CAISSON_DATA;
  if(!data||!Array.isArray(data.HOTSPOTS)||!data.STARTING)throw Error('Local caisson data is missing');
  HOTSPOTS=data.HOTSPOTS;
  const starting=data.STARTING;

  if(!Array.isArray(HOTSPOTS)||HOTSPOTS.length<100){
    throw Error('The caisson location list did not load correctly');
  }

  if(activeProjectId==='legacy')for(const [number,value] of Object.entries(starting)){
    if(!records[number])records[number]=value;
  }
  localStorage.setItem(NEW_KEY,JSON.stringify(records));

  renderPins();
  fitTransform();
  showTarget();
  bindTools();
  toast(`${HOTSPOTS.length} inspection items loaded`);
}
function stateClass(r,n){
 let c=`pin type-${itemType(r).toLowerCase()}`;
 if(num(r.lat)!=null&&num(r.lon)!=null)c+=' known';
 if((r.pickupTime||(Array.isArray(r.photos)&&r.photos.length))&&!r.unloadTime)c+=' picked';
 if(r.unloadTime)c+=' done';

 const ncrState=effectiveNcrState(n);
 if(ncrState==='open')c+=' ncr-open';
 else if(ncrState==='pending')c+=' ncr-pending';
 else if(ncrState==='cleared')c+=' ncr-cleared';

 if(n===nearest)c+=' nearest';
 if(n===selected)c+=' selected';
 return c
}
function renderPins(){if(!HOTSPOTS.length)return;const filter=currentFilter();$('pins').innerHTML=HOTSPOTS.filter(h=>!filter||itemType(rec(h.caisson))===filter).map(h=>{const r=rec(h.caisson);return`<button class="${stateClass(r,h.caisson)}" data-n="${h.caisson}" aria-label="${esc(itemName(h.caisson,r))}" style="left:${h.x}%;top:${h.y}%">${esc(pinLabel(h.caisson,r))}</button>`}).join('');document.querySelectorAll('.pin').forEach(p=>p.onclick=()=>{selected=+p.dataset.n;showTarget();scrollToSpot(selected)})}
function scrollToSpot(n){const h=HOTSPOTS.find(x=>x.caisson===n);if(!h)return;const s=$('mapShell'),m=$('map');s.scrollTo({left:m.offsetWidth*h.x/100-s.clientWidth/2,top:m.offsetHeight*h.y/100-s.clientHeight/2,behavior:'smooth'})}
function setMapWidth(next,anchorX=$('mapShell').clientWidth/2,anchorY=$('mapShell').clientHeight/2){
 const shell=$('mapShell'),map=$('map'),old=mapWidth;
 next=Math.max(700,Math.min(3600,Math.round(next)));
 const contentX=shell.scrollLeft+anchorX,contentY=shell.scrollTop+anchorY,ratio=next/old;
 mapWidth=next;map.style.width=`${mapWidth}px`;
 updatePinScale();
 shell.scrollLeft=contentX*ratio-anchorX;shell.scrollTop=contentY*ratio-anchorY;
 drawBlueDot()
}
function setMapWidthAt(next,mapX,mapY,anchorX,anchorY){
 const shell=$('mapShell'),map=$('map');next=Math.max(700,Math.min(3600,Math.round(next)));
 mapWidth=next;map.style.width=`${mapWidth}px`;
 updatePinScale();
 shell.scrollLeft=map.offsetWidth*mapX-anchorX;shell.scrollTop=map.offsetHeight*mapY-anchorY;
 drawBlueDot()
}
function resetMapZoom(){setMapWidth(mapBaseWidth)}
function updatePinScale(){const ratio=mapWidth/mapBaseWidth,scale=Math.min(1.7,Math.max(1,1+(ratio-1)*.55));$('map').style.setProperty('--pin-scale',scale.toFixed(3))}
function touchDistance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
function touchCenter(t,shell){const r=shell.getBoundingClientRect();return{x:(t[0].clientX+t[1].clientX)/2-r.left,y:(t[0].clientY+t[1].clientY)/2-r.top}}
function installMapZoom(){
 const shell=$('mapShell');$('map').style.width=`${mapWidth}px`;updatePinScale();
 $('zoomOut').onclick=()=>setMapWidth(mapWidth/1.25);$('zoomIn').onclick=()=>setMapWidth(mapWidth*1.25);$('zoomReset').onclick=resetMapZoom;
 $('mapCenter').onclick=()=>{autoCenter=true;if(lastPosition&&transform)centerOnGPS();else if(targetNumber())scrollToSpot(targetNumber());else shell.scrollTo({left:0,top:0,behavior:'smooth'})};
 shell.addEventListener('touchstart',e=>{if(e.touches.length!==2)return;autoCenter=false;const center=touchCenter(e.touches,shell),map=$('map');pinchStart={distance:touchDistance(e.touches),width:mapWidth,mapX:(shell.scrollLeft+center.x)/map.offsetWidth,mapY:(shell.scrollTop+center.y)/map.offsetHeight}},{passive:true});
 shell.addEventListener('touchmove',e=>{if(e.touches.length!==2||!pinchStart)return;e.preventDefault();const center=touchCenter(e.touches,shell);pinchPending={width:pinchStart.width*touchDistance(e.touches)/pinchStart.distance,center};if(!pinchFrame)pinchFrame=requestAnimationFrame(()=>{const p=pinchPending;pinchFrame=null;if(p&&pinchStart)setMapWidthAt(p.width,pinchStart.mapX,pinchStart.mapY,p.center.x,p.center.y)})},{passive:false});
 shell.addEventListener('touchend',e=>{if(e.touches.length<2){pinchStart=null;pinchPending=null;if(pinchFrame){cancelAnimationFrame(pinchFrame);pinchFrame=null}}},{passive:true});
}
function targetNumber(){return selected??nearest}
function gpsQuality(accuracy){return accuracy<=3?'Excellent':accuracy<=8?'Good':accuracy<=15?'Fair':'Poor'}
function gpsSnapshot(){const p=bestPosition&&Date.now()-(bestPosition.timestamp||0)<30000?bestPosition:lastPosition;if(!p)return null;return{lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy,time:new Date(p.timestamp||Date.now()).toISOString(),quality:gpsQuality(p.coords.accuracy),sampleCount:gpsSamples.length}}
function distanceTo(n){const r=rec(n);return lastPosition&&num(r.lat)!=null&&num(r.lon)!=null?Math.round(haversine(lastPosition.coords.latitude,lastPosition.coords.longitude,+r.lat,+r.lon)*3.28084):null}

function normalizeHeader(s){return String(s??'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function findField(row,names){
 const keys=Object.keys(row||{});
 for(const name of names){
   const target=normalizeHeader(name);
   const exact=keys.find(k=>normalizeHeader(k)===target);
   if(exact!=null)return row[exact];
 }
 for(const name of names){
   const target=normalizeHeader(name);
   const loose=keys.find(k=>normalizeHeader(k).includes(target)||target.includes(normalizeHeader(k)));
   if(loose!=null)return row[loose];
 }
 return ''
}
function numbersIn(value){
 const text=String(value??'');
 const nums=new Set();
 for(const match of text.matchAll(/\b\d{1,4}\b/g))nums.add(Number(match[0]));
 return [...nums]
}
function ncrId(row,index){
 return String(findField(row,['NCR Number','NCR #','NCR','ACC Number','ACC #'])||`NCR-${index+1}`).trim()
}
function ncrsForCaisson(n){
 return ncrRows.map((row,index)=>({row,index,id:ncrId(row,index)}))
   .filter(item=>numbersIn(findField(item.row,['Shafts Affected','Caissons Affected','Caisson','Shaft Number','Affected Shafts'])).includes(Number(n)))
}
function statusText(row){
 return String(findField(row,['NCR Status','Current Status','Status','RFI Status'])||'Status not listed').trim()
}
function isClosedNcr(row){
 return /closed|cleared|accepted|complete|resolved/i.test(statusText(row))
}

function officialNcrState(n){
 const list=ncrsForCaisson(n);
 if(!list.length)return 'none';

 let hasPending=false;
 for(const {row} of list){
   const s=statusText(row);
   if(/open|not closed|repair|required|corrective|rework|active/i.test(s))return 'open';
   if(/pending|review|waiting|rfi|approval|submitted|corrected/i.test(s))hasPending=true;
 }
 if(hasPending)return 'pending';
 if(list.every(({row})=>isClosedNcr(row)))return 'cleared';
 return 'open'
}
function effectiveNcrState(n){
 const manual=String(rec(n).ncrManualStatus||'').toLowerCase();
 if(manual==='open')return 'open';
 if(manual==='pending'||manual==='corrected-waiting')return 'pending';
 if(manual==='cleared')return 'cleared';
 return officialNcrState(n)
}
function updateManualNcrStatus(n,value){
 const r=rec(n);
 records[n]={...r,ncrManualStatus:value,updated:new Date().toISOString()};
 persist();
 showTarget();
 toast(value?`NCR status set to ${value.replaceAll('-',' ')}`:'Using spreadsheet NCR status')
}
function ncrStateLabel(n){
 const s=effectiveNcrState(n);
 return s==='open'?'OPEN':s==='pending'?'PENDING / WAITING':s==='cleared'?'CLEARED':'NO NCR'
}

function ncrSummaryHtml(n){
 const list=ncrsForCaisson(n);
 const manual=rec(n).ncrManualStatus||'';
 const selector=`<div class="ncr-manual">
   <label class="label">NCR STATUS FOR THIS ITEM</label>
   <select class="field" onchange="updateManualNcrStatus(${n},this.value)">

 const ncrHtml=ncrs.length?ncrs.map(({row,id})=>`<section class="ncr"><h3>${esc(id)} — ${esc(statusText(row))}</h3><p><b>Issue:</b> ${esc(findField(row,['Description','NCR Description','Issue Description','Issue'])||'Not listed')}</p><p><b>Correction required:</b> ${esc(findField(row,['Corrective Description','Corrective Action','Correction Required','SUG Work','Work Required'])||'Not listed')}</p><p><b>RFI:</b> ${esc(findField(row,['RFI Status','RFI','RFI Number'])||'Not listed')}</p><p><b>Ball in court:</b> ${esc(findField(row,['Ball in Court','Responsible Party','Owner'])||'Not listed')}</p></section>`).join(''):'<p>No imported NCR lists this item.</p>';
 const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(itemName(n,r))} Field Log</title><style>
 body{font:14px Arial,sans-serif;color:#111;margin:28px}h1{margin-bottom:4px}.meta{border-collapse:collapse;width:100%;margin:12px 0}.meta td{border:1px solid #aaa;padding:7px}.ncr{border:2px solid #d49300;padding:10px;margin:10px 0;break-inside:avoid}.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo{break-inside:avoid;border:1px solid #aaa;padding:6px}.photo img{width:100%;max-height:520px;object-fit:contain}@media print{button{display:none}.photos{display:block}.photo{margin:0 0 12px}}
 </style></head><body><button onclick="window.print()" style="font-size:18px;padding:12px 20px;margin-right:8px">Print / Share Copy</button><button onclick="if(window.opener){window.opener.focus();window.close()}else{history.back()}" style="font-size:18px;padding:12px 20px">Back to FieldVerify Pro</button><p><b>A restorable PDF was also saved to your phone.</b> Use that downloaded PDF with Restore Project.</p>
 <h1>FieldVerify Pro — ${esc(itemName(n,r))}</h1><div>Created ${new Date().toLocaleString()}</div>
 <table class="meta"><tr><td><b>Item type</b></td><td>${esc(itemType(r))}</td></tr><tr><td><b>Status</b></td><td>${esc(r.status||'No information')}</td></tr><tr><td><b>Saved latitude / longitude</b></td><td>${num(r.lat)!=null&&num(r.lon)!=null?`${r.lat}, ${r.lon}`:'Not saved'}</td></tr><tr><td><b>Started</b></td><td>${r.pickupTime?new Date(r.pickupTime).toLocaleString():'—'}</td></tr><tr><td><b>Start GPS</b></td><td>${r.pickupGPS?`${r.pickupGPS.lat}, ${r.pickupGPS.lon} · accuracy ±${Math.round((r.pickupGPS.accuracy||0)*3.28084)} ft · ${new Date(r.pickupGPS.time).toLocaleString()}`:'Not captured'}</td></tr><tr><td><b>Completed</b></td><td>${r.unloadTime?new Date(r.unloadTime).toLocaleString():'—'}</td></tr><tr><td><b>Completion GPS</b></td><td>${r.unloadGPS?`${r.unloadGPS.lat}, ${r.unloadGPS.lon} · accuracy ±${Math.round((r.unloadGPS.accuracy||0)*3.28084)} ft · ${new Date(r.unloadGPS.time).toLocaleString()}`:'Not captured'}</td></tr></table>
 <h2>Inspection Checklist</h2>${inspectionReportHtml(r)}<h2>Field Notes</h2><p style="white-space:pre-wrap">${esc(r.notes||'No field notes')}</p><h2>NCR Information</h2><p><b>Map NCR status:</b> ${esc(ncrStateLabel(n))}</p>${ncrHtml}<h2>Photos (${photos.length})</h2><div class="photos">${photoHtml.join('')}</div></body></html>`;
 w.document.open();w.document.write(html);w.document.close()
}

$('restoreInput').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  toast('Restoring project and attachments…');
  let j;if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){const pdf=await pdfInfo(f),attachments=await pdf.getAttachments(),backup=attachments&&Object.values(attachments).find(x=>String(x.filename||'').toLowerCase().endsWith('.json'));if(!backup?.content)throw Error('This PDF does not contain a FieldVerify project backup');j=JSON.parse(new TextDecoder().decode(backup.content))}else j=JSON.parse(await f.text());let incoming=j.records||j.foundationInspectorRecords||j.localStorage?.foundationInspectorRecords;
  if(typeof incoming==='string')incoming=JSON.parse(incoming);
  if(!incoming||typeof incoming!=='object')throw Error('No records found');
  if(j.project&&typeof j.project==='object'){
   persist();persistNcr();
   const restoredProject={...j.project,id:String(j.project.id||`restored-${Date.now()}`),name:String(j.project.name||'Restored Project')},at=projects.findIndex(p=>p.id===restoredProject.id);
   if(at>=0)projects[at]={...projects[at],...restoredProject};else projects.push(restoredProject);
   activeProjectId=restoredProject.id;saveProjects();loadRecords()
  }
  records={...records,...incoming};
  const restoredNcr=j.ncrRows||j.foundationInspectorNcrData||j.localStorage?.foundationInspectorNcrData;
  if(Array.isArray(restoredNcr)){ncrRows=restoredNcr;persistNcr()}
  const db=await openDB();let photoCount=0,pdfCount=0,skipped=0;
  if(Array.isArray(j.photos)&&j.photos.length){const tx=db.transaction('photos','readwrite'),store=tx.objectStore('photos');for(const p of j.photos)if(p.id&&p.data){try{store.put({...p,blob:dataURLToBlob(p.data),data:undefined});photoCount++}catch{skipped++}}await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
  if(Array.isArray(j.ncrPdfs)&&j.ncrPdfs.length){const tx=db.transaction('ncrPdfs','readwrite'),store=tx.objectStore('ncrPdfs');for(const p of j.ncrPdfs)if(p.id&&p.data){try{store.put({...p,blob:dataURLToBlob(p.data),data:undefined});localStorage.setItem(`ncrpdf:${p.id}`,'yes');pdfCount++}catch{skipped++}}await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
  if(j.customDrawing?.data){const tx=db.transaction('settings','readwrite');tx.objectStore('settings').put({id:drawingStorageId(),name:j.customDrawing.name||'Restored drawing',type:j.customDrawing.type||'image/png',date:j.customDrawing.date||new Date().toISOString(),pageNumber:j.customDrawing.pageNumber||1,pageCount:j.customDrawing.pageCount||1,blob:dataURLToBlob(j.customDrawing.data)});await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});await applyStoredDrawing()}
  persist();persistNcr();selected=null;nearest=null;await applyStoredDrawing();renderPins();showProjectHome();toast(`Restored ${Object.keys(incoming).length} records, ${photoCount} photos, ${pdfCount} NCR PDFs${skipped?` · ${skipped} damaged files skipped`:''}`)
 }catch(err){toast(`Restore failed: ${err.message}`)}
 e.target.value=''
}
function updateNetworkStatus(){const b=$('networkStatus');b.textContent=navigator.onLine?'Online · offline ready':'Offline · data saving';b.style.background=navigator.onLine?'#16803d':'#b42318'}
async function enableOffline(){updateNetworkStatus();addEventListener('online',()=>{updateNetworkStatus();toast('Connection restored')});addEventListener('offline',()=>{updateNetworkStatus();toast('Offline mode — work will keep saving')});if(!('serviceWorker'in navigator))return;try{const reg=await navigator.serviceWorker.register('./service-worker.js');reg.update().catch(()=>{});reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)toast('App update ready — refresh when convenient')})})}catch(err){console.warn('Offline setup failed',err)}}
$('find').onclick=()=>{const q=$('search').value.trim().toLowerCase();const hit=HOTSPOTS.find(h=>String(h.caisson)===q||itemName(h.caisson,rec(h.caisson)).toLowerCase()===q)||HOTSPOTS.find(h=>itemName(h.caisson,rec(h.caisson)).toLowerCase().includes(q));if(q&&hit){selected=hit.caisson;showTarget();scrollToSpot(selected)}else toast('Item not found')};$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};$('itemFilter').onchange=()=>{renderPins();selected=null;nearest=null;showTarget();toast(currentFilter()?`Showing ${currentFilter()} items`:'Showing all item types')};$('mapShell').addEventListener('touchstart',()=>autoCenter=false,{passive:true});$('mapShell').addEventListener('mousedown',()=>autoCenter=false);$('locate').onclick=startGPS;$('projectsBtn').onclick=showProjectHome;
initializeProjects();installMapZoom();loadRecords();applyStoredDrawing();loadHotspots().then(showProjectHome).catch(e=>{$('panel').innerHTML=`<div class="card"><h2>App could not load the drawing</h2><div class="notice">${esc(e.message)}</div><p class="tiny">Reload the page. If you opened the app before, offline mode will use the saved copy.</p></div>${toolCard()}`;bindTools();});bindTools();enableOffline();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&watchId!=null&&Date.now()-lastGoodAt>10000)startGPS()});
</script>
