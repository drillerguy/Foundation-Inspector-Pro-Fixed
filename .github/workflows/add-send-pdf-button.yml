name: Add send PDF button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-send-pdf-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-live-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add full-project PDF sender to the real app page
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<script src="daily-report-v10.js?v=send-all-20260806"></script>'
          if tag not in html:
              if '</body>' not in html:
                  raise SystemExit('index.html has no closing body tag')
              html = html.replace('</body>', tag + '\n</body>', 1)
              index.write_text(html, encoding='utf-8')

          report = Path('daily-report-v10.js')
          js = report.read_text(encoding='utf-8')
          js = js.replace("fullButton.textContent = 'MAKE FULL PROJECT PDF';", "fullButton.textContent = 'SEND PDF WITH ALL DATA & PICTURES';")
          js = js.replace("fullButton.style.background = '#16803d';", "fullButton.style.background = '#b42318';")
          js = js.replace("(isFullProject ? 'MAKE FULL PROJECT PDF' : 'MAKE TODAY’S FULL PDF')", "(isFullProject ? 'SEND PDF WITH ALL DATA & PICTURES' : 'MAKE TODAY’S FULL PDF')")
          report.write_text(js, encoding='utf-8')
          PY

      - name: Commit the actual index.html change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html daily-report-v10.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: add send PDF with all data and pictures button"
            git push origin main
          fi

