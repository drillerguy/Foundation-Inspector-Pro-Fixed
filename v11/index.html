<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#083a73">
  <title>FieldVerify Pro 11</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">FieldVerify Pro <span>11.0-alpha</span></div>
      <div class="subtitle">Clean rebuild · no service worker · no background sync</div>
    </div>
    <div class="header-actions">
      <select id="projectSelect" aria-label="Project"></select>
      <span id="saveState" class="save-state">Ready</span>
    </div>
  </header>

  <section class="toolbar">
    <select id="itemType" aria-label="Item type">
      <option>Caisson</option>
      <option>ERS</option>
      <option>Tieback</option>
      <option>Waler</option>
      <option>Footing</option>
      <option>Column</option>
      <option>Custom</option>
    </select>
    <select id="drawingSelect" aria-label="Drawing"></select>
    <button id="pagesBtn" type="button">Pages</button>
    <button id="loadDrawingBtn" type="button">Load Drawing</button>
    <input id="drawingInput" type="file" accept="application/pdf,image/*" hidden>
    <input id="itemSearch" inputmode="text" placeholder="Item # / ID">
    <button id="openItemBtn" type="button">Open</button>
  </section>

  <main class="workspace">
    <section class="drawing-pane">
      <div id="drawingStatus" class="drawing-status">Loading drawing…</div>
      <div id="mapShell" class="map-shell">
        <div id="map" class="map">
          <img id="planImage" src="../caisson-plan.png" alt="Foundation plan">
          <div id="pins" class="pins"></div>
        </div>
      </div>
    </section>

    <aside id="panel" class="panel">
      <div class="card intro-card">
        <h2>FieldVerify Pro 11</h2>
        <p>This rebuild reads your existing FieldVerify project data into a separate v11 workspace. The old app remains untouched.</p>
      </div>
    </aside>
  </main>

  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="../caisson-data.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
