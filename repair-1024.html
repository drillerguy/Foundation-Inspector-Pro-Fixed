<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FieldVerify Repair</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f6;color:#15202b;margin:0;padding:24px}.card{max-width:520px;margin:8vh auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 18px #0002}h1{margin-top:0;color:#083a73}.bar{height:12px;background:#dce4ec;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:15%;background:#16803d;transition:width .3s}.small{color:#65717d}</style>
</head>
<body><div class="card"><h1>Repairing FieldVerify Pro</h1><p id="status">Removing the broken cached version…</p><div class="bar"><i id="bar"></i></div><p class="small">This does not delete your saved FieldVerify project data.</p></div>
<script>
(async()=>{
 const status=document.getElementById('status'),bar=document.getElementById('bar');
 try{
   bar.style.width='30%';
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister()));
   }
   bar.style.width='55%';
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.map(k=>caches.delete(k)));
   }
   bar.style.width='80%';
   status.textContent='Repair complete. Reloading the clean v10.24 app…';
   bar.style.width='100%';
   setTimeout(()=>location.replace('./?repair1024='+Date.now()),700);
 }catch(e){
   status.textContent='Repair hit an error: '+(e.message||e)+'. Close Safari and reopen FieldVerify.';
 }
})();
</script></body></html>
