<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#083a73">
<link rel="manifest" href="manifest.webmanifest">
<title>Foundation Inspector Pro</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15202b;background:#eef2f6}*{box-sizing:border-box}body{margin:0;overscroll-behavior:none}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;font-weight:900}.top{position:sticky;top:0;z-index:40;background:#083a73;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}.title{font-size:19px;font-weight:900}.gpsline{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:12px}.badge{background:#ffffff22;border:1px solid #ffffff33;border-radius:999px;padding:4px 8px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-top:7px}.toolbar input{min-width:0;border:0;border-radius:10px;padding:10px}.toolbar button{padding:10px 12px;background:#fff;color:#083a73}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100vh - 120px)}.map-shell{position:relative;overflow:auto;background:#616b75;-webkit-overflow-scrolling:touch}.map{position:relative;width:1800px;line-height:0;background:#fff}.map img{display:block;width:100%;height:auto}.pins,.gps-layer{position:absolute;inset:0;pointer-events:none}.pin{pointer-events:auto;position:absolute;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;background:#747e88;color:#fff;line-height:16px;text-align:center;font-size:7px;font-weight:900;box-shadow:0 1px 5px #0008}.pin.known{background:#16803d}.pin.picked{background:#7b3fc6}.pin.done{background:#16803d}.pin.nearest{width:34px;height:34px;line-height:30px;font-size:11px;background:#ff9f0a;z-index:8}.pin.selected{outline:4px solid #fff9;z-index:9}.blue-dot{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);border-radius:50%;background:#0a84ff;border:4px solid #fff;box-shadow:0 1px 9px #0009;z-index:15}.accuracy{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:#0a84ff20;border:1px solid #0a84ff80;z-index:12}.panel{background:#fff;border-left:1px solid #cbd3dc;padding:10px;overflow:auto}.card{border:1px solid #d7dee7;border-radius:14px;padding:12px;margin-bottom:10px}.card h2{margin:0 0 7px;font-size:22px}.statusrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.pill{border-radius:999px;background:#edf1f5;padding:5px 8px;font-size:12px;font-weight:900}.pill.blue{background:#dceeff;color:#0058a8}.pill.green{background:#dff4e5;color:#12642f}.big-actions{display:grid;gap:9px}.action{width:100%;min-height:58px;font-size:20px;color:#fff}.pickup{background:#7b3fc6}.unload{background:#16803d}.photo{background:#0b67c2}.next{background:#e7edf4;color:#16202a}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools button{padding:12px;background:#e7edf4;color:#16202a}.label{font-size:12px;color:#66717c;margin:9px 0 4px;display:block}.field{width:100%;border:1px solid #c8d0d9;border-radius:10px;padding:10px}.tiny{font-size:12px;color:#687480}.notice{background:#fff4cc;border:1px solid #f0cc55;border-radius:10px;padding:9px;font-size:12px}.empty{text-align:center;color:#6d7883;padding:25px 8px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;background:#111;color:#fff;padding:11px 15px;border-radius:11px;font-weight:800;box-shadow:0 4px 20px #0007}.legend{position:fixed;left:9px;bottom:9px;z-index:20;background:#fffe;padding:7px 9px;border-radius:10px;font-size:11px;box-shadow:0 2px 10px #0003}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px}@media(max-width:760px){.top{position:relative}.layout{display:block;height:auto}.map-shell{height:57vh}.map{width:1500px}.panel{border-left:0;border-top:1px solid #ccd4dd;min-height:43vh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.legend{bottom:44vh}.action{min-height:62px}}
</style>
</head>
<body>
<header class="top"><div class="title">Foundation Inspector Pro <span style="font-size:11px;opacity:.75">v6</span></div><div class="gpsline"><span id="gpsStatus" class="badge">GPS off</span><span id="accuracyStatus" class="badge">Accuracy —</span><span id="targetStatus" class="badge">No target</span></div><div class="toolbar"><input id="search" type="number" inputmode="numeric" placeholder="Caisson number"><button id="find">Find</button><button id="locate">Start GPS</button></div></header>
<div class="layout"><section class="map-shell" id="mapShell"><div class="map" id="map"><img src="../-ORD-Caisson-Inspector/caisson-plan.png" alt="ORD caisson plan"><div class="pins" id="pins"></div><div class="gps-layer" id="gpsLayer"></div></div></section><aside class="panel" id="panel"><div class="empty">Loading caisson drawing…</div></aside></div>
<input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment" multiple>
<input id="restoreInput" class="hidden" type="file" accept="application/json,.json">
<div class="legend"><span class="dot" style="background:#0a84ff"></span>You &nbsp;<span class="dot" style="background:#ff9f0a"></span>Next &nbsp;<span class="dot" style="background:#7b3fc6"></span>Picked &nbsp;<span class="dot" style="background:#16803d"></span>Unloaded</div>
<div id="toast" class="toast hidden"></div>
<script>
const OLD_INDEX='../-ORD-Caisson-Inspector/index.html',OLD_KEY='ordCaissonRecords',NEW_KEY='foundationInspectorRecords';
let HOTSPOTS=[],records={},selected=null,nearest=null,watchId=null,refreshTimer=null,transform=null,lastPosition=null,lastGoodAt=0,autoCenter=true;
const $=id=>document.getElementById(id),num=v=>{const n=Number(v);return Number.isFinite(n)?n:null},esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':'&quot;'}[m]));
function defaultRec(){return{status:'No information',verified:false,notes:'',lat:null,lon:null,condition:'',updated:'',photos:[],pickupTime:null,unloadTime:null,pickupGPS:null,unloadGPS:null}}
function rec(n){return{...defaultRec(),...(records[n]||{})}}
function loadRecords(){try{records={...JSON.parse(localStorage.getItem(OLD_KEY)||'{}'),...JSON.parse(localStorage.getItem(NEW_KEY)||'{}')}}catch{records={}};persist()}
function persist(){localStorage.setItem(NEW_KEY,JSON.stringify(records));renderPins();fitTransform()}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.add('hidden'),2400)}
async function loadHotspots(){const text=await fetch(OLD_INDEX,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Drawing data unavailable');return r.text()}),m=text.match(/const HOTSPOTS=(\[[\s\S]*?\]);\s*const STARTING=/);if(!m)throw Error('Could not read caisson locations');HOTSPOTS=JSON.parse(m[1]);renderPins();fitTransform();showTarget()}
function stateClass(r,n){let c='pin';if(num(r.lat)!=null&&num(r.lon)!=null)c+=' known';if(r.pickupTime&&!r.unloadTime)c+=' picked';if(r.unloadTime)c+=' done';if(n===nearest)c+=' nearest';if(n===selected)c+=' selected';return c}
function renderPins(){if(!HOTSPOTS.length)return;$('pins').innerHTML=HOTSPOTS.map(h=>`<button class="${stateClass(rec(h.caisson),h.caisson)}" data-n="${h.caisson}" style="left:${h.x}%;top:${h.y}%">${h.caisson}</button>`).join('');document.querySelectorAll('.pin').forEach(p=>p.onclick=()=>{selected=+p.dataset.n;showTarget();scrollToSpot(selected)})}
function scrollToSpot(n){const h=HOTSPOTS.find(x=>x.caisson===n);if(!h)return;const s=$('mapShell'),m=$('map');s.scrollTo({left:m.offsetWidth*h.x/100-s.clientWidth/2,top:m.offsetHeight*h.y/100-s.clientHeight/2,behavior:'smooth'})}
function targetNumber(){return selected??nearest}
function gpsSnapshot(){if(!lastPosition)return null;return{lat:lastPosition.coords.latitude,lon:lastPosition.coords.longitude,accuracy:lastPosition.coords.accuracy,time:new Date(lastPosition.timestamp||Date.now()).toISOString()}}
function distanceTo(n){const r=rec(n);return lastPosition&&num(r.lat)!=null&&num(r.lon)!=null?Math.round(haversine(lastPosition.coords.latitude,lastPosition.coords.longitude,+r.lat,+r.lon)*3.28084):null}
function showTarget(){const n=targetNumber();$('targetStatus').textContent=n?`Target ${n}`:'No target';if(!n){$('panel').innerHTML=`<div class="card"><h2>Ready to work</h2><div class="notice">Start GPS. The nearest unfinished GPS-saved caisson will turn orange.</div></div>${toolCard()}`;return}const r=rec(n),d=distanceTo(n),stage=r.unloadTime?'Unloaded':r.pickupTime?'Picked up':'Ready';$('panel').innerHTML=`<div class="card"><h2>Caisson ${n}</h2><div class="statusrow"><span class="pill ${r.unloadTime?'green':''}">${stage}</span>${d!=null?`<span class="pill blue">${d} ft away</span>`:''}</div><div class="big-actions"><button id="pickupBtn" class="action pickup">PICK UP</button><button id="unloadBtn" class="action unload">UNLOAD</button><button id="photoBtn" class="action photo">TAKE PHOTO</button><button id="nextBtn" class="action next">NEXT CAISSON</button></div><label class="label">Notes (optional)</label><textarea id="notes" class="field" rows="3">${esc(r.notes)}</textarea><button id="saveNotes" class="action next" style="min-height:42px;font-size:15px;margin-top:7px">Save Notes</button><div class="tiny" style="margin-top:8px">Pickup: ${r.pickupTime?new Date(r.pickupTime).toLocaleString():'—'}<br>Unload: ${r.unloadTime?new Date(r.unloadTime).toLocaleString():'—'}</div></div>${toolCard()}`;
$('pickupBtn').onclick=()=>markPickup(n);$('unloadBtn').onclick=()=>markUnload(n);$('photoBtn').onclick=()=>{$('cameraInput').dataset.caisson=n;$('cameraInput').click()};$('nextBtn').onclick=chooseNext;$('saveNotes').onclick=()=>{records[n]={...r,notes:$('notes').value,updated:new Date().toISOString()};persist();toast('Notes saved')};bindTools()}
function toolCard(){return`<div class="card"><div class="tools"><button id="backupBtn">Backup Project</button><button id="restoreBtn">Restore Project</button><button id="centerBtn">Center on Me</button><button id="gpsBtn">Restart GPS</button></div></div>`}
function bindTools(){if($('backupBtn'))$('backupBtn').onclick=backupProject;if($('restoreBtn'))$('restoreBtn').onclick=()=>$('restoreInput').click();if($('centerBtn'))$('centerBtn').onclick=()=>{autoCenter=true;centerOnGPS()};if($('gpsBtn'))$('gpsBtn').onclick=startGPS}
function markPickup(n){const r=rec(n),g=gpsSnapshot();records[n]={...r,pickupTime:new Date().toISOString(),pickupGPS:g,status:'Picked up',updated:new Date().toISOString()};persist();toast(`Caisson ${n} picked up`);showTarget()}
function markUnload(n){const r=rec(n),g=gpsSnapshot();records[n]={...r,unloadTime:new Date().toISOString(),unloadGPS:g,status:'Unloaded',verified:!!g,lat:g?.lat??r.lat,lon:g?.lon??r.lon,updated:new Date().toISOString()};persist();toast(`Caisson ${n} unloaded`);selected=null;chooseNext()}
function chooseNext(){if(!lastPosition){selected=null;showTarget();toast('Start GPS first');return}const b=nearestUnfinished(lastPosition.coords.latitude,lastPosition.coords.longitude);nearest=b?.n??null;selected=nearest;renderPins();showTarget();if(selected)scrollToSpot(selected)}
function nearestUnfinished(lat,lon){let best=null;for(const h of HOTSPOTS){const r=rec(h.caisson);if(r.unloadTime||num(r.lat)==null||num(r.lon)==null)continue;const d=haversine(lat,lon,+r.lat,+r.lon);if(!best||d<best.d)best={n:h.caisson,d}}return best}
function haversine(a,b,c,d){const R=6371000,t=Math.PI/180,da=(c-a)*t,db=(d-b)*t,q=Math.sin(da/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function solve3(A,b){A=A.map((r,i)=>[...r,b[i]]);for(let i=0;i<3;i++){let p=i;for(let j=i+1;j<3;j++)if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;[A[i],A[p]]=[A[p],A[i]];if(Math.abs(A[i][i])<1e-14)return null;for(let j=i+1;j<3;j++){const f=A[j][i]/A[i][i];for(let k=i;k<4;k++)A[j][k]-=f*A[i][k]}}const x=[0,0,0];for(let i=2;i>=0;i--)x[i]=(A[i][3]-A[i].slice(i+1,3).reduce((s,v,k)=>s+v*x[i+1+k],0))/A[i][i];return x}
function regress(points,key){const M=[[0,0,0],[0,0,0],[0,0,0]],b=[0,0,0];for(const p of points){const v=[p.lon,p.lat,1],y=p[key];for(let i=0;i<3;i++){b[i]+=v[i]*y;for(let j=0;j<3;j++)M[i][j]+=v[i]*v[j]}}return solve3(M,b)}
function fitTransform(){const pts=HOTSPOTS.map(h=>{const r=rec(h.caisson);return num(r.lat)!=null&&num(r.lon)!=null?{lat:+r.lat,lon:+r.lon,x:h.x,y:h.y}:null}).filter(Boolean);if(pts.length<3){transform=null;return}const ax=regress(pts,'x'),ay=regress(pts,'y');transform=ax&&ay?{ax,ay}:null}
function project(lat,lon){return transform?{x:transform.ax[0]*lon+transform.ax[1]*lat+transform.ax[2],y:transform.ay[0]*lon+transform.ay[1]*lat+transform.ay[2]}:null}
function startGPS(){stopGPS();$('gpsStatus').textContent='GPS searching…';const opts={enableHighAccuracy:true,maximumAge:0,timeout:12000};watchId=navigator.geolocation.watchPosition(updateGPS,geoError,opts);refreshTimer=setInterval(()=>navigator.geolocation.getCurrentPosition(updateGPS,()=>{},opts),5000);$('locate').textContent='Stop GPS';$('locate').onclick=stopGPS}
function stopGPS(){if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;if(refreshTimer)clearInterval(refreshTimer);refreshTimer=null;$('gpsStatus').textContent='GPS off';$('locate').textContent='Start GPS';$('locate').onclick=startGPS}
function updateGPS(p){if(lastPosition&&p.timestamp<lastPosition.timestamp)return;lastPosition=p;lastGoodAt=Date.now();$('gpsStatus').textContent='GPS live';$('accuracyStatus').textContent=`Accuracy ±${Math.round(p.coords.accuracy*3.28084)} ft`;const b=nearestUnfinished(p.coords.latitude,p.coords.longitude);nearest=b?.n??null;if(selected==null)selected=nearest;renderPins();drawBlueDot();showTarget();if(autoCenter)centerOnGPS()}
function drawBlueDot(){const p=lastPosition,q=p&&project(p.coords.latitude,p.coords.longitude),layer=$('gpsLayer');if(!q){layer.innerHTML='';return}const m=$('map'),probe=project(p.coords.latitude,p.coords.longitude+.00001),meters=haversine(p.coords.latitude,p.coords.longitude,p.coords.latitude,p.coords.longitude+.00001),pct=Math.max(.00001,Math.abs(probe.x-q.x)),pxPerMeter=(m.offsetWidth*pct/100)/meters,r=Math.max(30,p.coords.accuracy*pxPerMeter*2);layer.innerHTML=`<div class="accuracy" style="left:${q.x}%;top:${q.y}%;width:${r}px;height:${r}px"></div><div class="blue-dot" style="left:${q.x}%;top:${q.y}%"></div>`}
function centerOnGPS(){if(!lastPosition)return;const q=project(lastPosition.coords.latitude,lastPosition.coords.longitude);if(!q)return;const s=$('mapShell'),m=$('map');s.scrollTo({left:m.offsetWidth*q.x/100-s.clientWidth/2,top:m.offsetHeight*q.y/100-s.clientHeight/2,behavior:'smooth'})}
function geoError(e){$('gpsStatus').textContent=e.code===1?'Location permission denied':'GPS signal lost';if(e.code===1)toast('Allow Precise Location for Safari in iPhone Settings')}
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('ordCaissonPhotos',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('photos'))q.result.createObjectStore('photos',{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
$('cameraInput').onchange=async e=>{const n=+e.target.dataset.caisson,files=[...e.target.files];if(!n||!files.length)return;const db=await openDB(),tx=db.transaction('photos','readwrite'),store=tx.objectStore('photos'),r=rec(n),ids=[...(r.photos||[])];for(const f of files){const id=`${n}-${Date.now()}-${Math.random()}`;store.put({id,caisson:n,name:f.name,type:f.type,blob:f,date:new Date().toISOString()});ids.push(id)}tx.oncomplete=()=>{records[n]={...r,photos:ids,updated:new Date().toISOString()};persist();showTarget();toast(`${files.length} photo${files.length===1?'':'s'} saved`)};e.target.value=''}
async function backupProject(){const photos=[];try{const db=await openDB(),tx=db.transaction('photos'),store=tx.objectStore('photos'),all=await new Promise((res,rej)=>{const q=store.getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});for(const p of all){const data=await blobToDataURL(p.blob);photos.push({...p,blob:undefined,data})}}catch{}const payload={app:'Foundation Inspector Pro',version:6,created:new Date().toISOString(),records,photos};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:'application/json'}));a.download=`Foundation-Inspector-Backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup created')}
function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function dataURLToBlob(s){const [h,b]=s.split(','),mime=(h.match(/:(.*?);/)||[])[1]||'application/octet-stream',bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
$('restoreInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text()),incoming=j.records||j.foundationInspectorRecords||j.localStorage?.foundationInspectorRecords;if(!incoming||typeof incoming!=='object')throw Error('No records found');records={...records,...incoming};if(Array.isArray(j.photos)&&j.photos.length){const db=await openDB(),tx=db.transaction('photos','readwrite'),store=tx.objectStore('photos');for(const p of j.photos){if(p.id&&p.data)store.put({...p,blob:dataURLToBlob(p.data),data:undefined})}await new Promise(res=>tx.oncomplete=res)}persist();selected=null;nearest=null;showTarget();toast('Project restored')}catch(err){toast(`Restore failed: ${err.message}`)}e.target.value=''}
$('find').onclick=()=>{const n=+$('search').value;if(HOTSPOTS.some(h=>h.caisson===n)){selected=n;showTarget();scrollToSpot(n)}else toast('Caisson not found')};$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};$('mapShell').addEventListener('touchstart',()=>autoCenter=false,{passive:true});$('mapShell').addEventListener('mousedown',()=>autoCenter=false);$('locate').onclick=startGPS;
loadRecords();loadHotspots().catch(e=>$('panel').innerHTML=`<div class="notice">${esc(e.message)}</div>${toolCard()}`);bindTools();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&watchId!=null&&Date.now()-lastGoodAt>10000)startGPS()});
</script>
</body>
</html>
