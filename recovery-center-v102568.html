<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FieldVerify Recovery Center</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16202a;background:#eef2f6}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:820px;margin:auto}.top{background:#083a73;color:#fff;padding:16px;border-radius:16px;margin-bottom:12px}.top h1{margin:0 0 4px;font-size:24px}.card{background:#fff;border:1px solid #d7dee7;border-radius:16px;padding:14px;margin:10px 0}.notice{background:#fff4cc;border:1px solid #e5c04b;border-radius:12px;padding:10px;margin:10px 0}.ok{background:#e7f7ec;border-color:#a9d6b5}.bad{background:#fdecec;border-color:#e3abab}button{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;font-weight:900;font-size:17px}.blue{background:#083a73;color:#fff}.green{background:#16803d;color:#fff}.gray{background:#e7edf4;color:#16202a}.purple{background:#7b3fc6;color:#fff}.orange{background:#c56a00;color:#fff}.small{font-size:12px;color:#66717c}.result{white-space:pre-wrap;font-size:13px;line-height:1.45}.hidden{display:none}.proj{padding:10px;margin:7px 0;border-radius:12px;background:#eef3f8}.warn{color:#9a3b00;font-weight:800}</style></head><body><div class="wrap"><div class="top"><h1>FieldVerify Data Recovery</h1><div>v10.25.68 Recovery Center</div></div><div class="notice"><b>Safe mode:</b> scanning and analysis are read-only. Nothing is deleted. Safe photo recovery only adds a missing photo when no photo with that ID already exists.</div><div class="card"><button id="scan" class="blue">SCAN CURRENT PROJECT</button><button id="scanAll" class="orange">SCAN ALL PROJECTS</button><button id="analyze" class="gray">ANALYZE BACKUP JSON FILES</button><button id="recover" class="green">RECOVER SAFE PHOTOS FROM JSON</button><button id="export" class="gray">EXPORT RECOVERY REPORT</button><button id="back" class="purple">BACK TO FIELDVERIFY</button><input id="files" class="hidden" type="file" accept="application/json,.json" multiple></div><div id="status" class="card"><b>Ready.</b><div class="small">For recovery cleanup, use Scan All Projects.</div></div><div id="results"></div></div><script>'use strict';
const ACTIVE_KEY='fieldVerifyActiveProject',PROJECTS_KEY='fieldVerifyProjects',LEGACY_KEY='foundationInspectorRecords';let lastReport=null;const $=id=>document.getElementById(id),uniq=a=>[...new Set((a||[]).filter(Boolean).map(String))];
function activeId(){return localStorage.getItem(ACTIVE_KEY)||'legacy'}function keyFor(id){return id==='legacy'?LEGACY_KEY:`fieldVerifyProjectRecords:${id}`}function readJson(k,f){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?f:v}catch{return f}}function readRecords(id=activeId()){const v=readJson(keyFor(id),{});return v&&typeof v==='object'?v:{}}function writeRecords(v,id=activeId()){localStorage.setItem(keyFor(id),JSON.stringify(v))}function refsOf(records){const m=new Map();for(const [n,r] of Object.entries(records||{}))for(const id of uniq(r?.photos))m.set(id,String(n));return m}function req(q){return new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error||Error('IndexedDB request failed'))})}function done(tx){return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error||Error('IndexedDB transaction failed'));tx.onabort=()=>rej(tx.error||Error('IndexedDB transaction aborted'))})}
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('ordCaissonPhotos',3);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('photos'))q.result.createObjectStore('photos',{keyPath:'id'});if(!q.result.objectStoreNames.contains('ncrPdfs'))q.result.createObjectStore('ncrPdfs',{keyPath:'id'});if(!q.result.objectStoreNames.contains('settings'))q.result.createObjectStore('settings',{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}function setStatus(t){$('status').innerHTML=`<b>${t}</b>`}function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}async function hashBlob(blob){if(!blob||!blob.size)return'';return hex(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))}function decodeDataUrl(value){const m=String(value||'').match(/^data:([^;,]+)?(;base64)?,(.*)$/s);if(!m)throw Error('Invalid photo data');const type=m[1]||'image/jpeg',body=m[3]||'';if(m[2]){const bin=atob(body.replace(/\s/g,'')),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type})}return new Blob([decodeURIComponent(body)],{type})}function photoItem(p){return p?.caisson??p?.number??p?.itemNumber??p?.item??p?.item_key??null}
async function photoRowsWithHashes(){const db=await openDB(),tx=db.transaction('photos','readonly'),store=tx.objectStore('photos'),raw=[];await new Promise((res,rej)=>{const q=store.openCursor();q.onerror=()=>rej(q.error);q.onsuccess=()=>{const c=q.result;if(!c){res();return}raw.push(c.value||{});c.continue()}});await done(tx).catch(()=>{});const rows=[];for(let i=0;i<raw.length;i++){const p=raw[i],id=String(p.id||''),hash=await hashBlob(p.blob);rows.push({id,item:String(photoItem(p)??''),projectId:String(p.projectId??''),bytes:Number(p.blob?.size||0),hash});if(i%10===9)setStatus(`Checking stored photos… ${i+1} of ${raw.length}`)}return rows}
function duplicateGroups(rows){const by=new Map();for(const r of rows)if(r.hash){if(!by.has(r.hash))by.set(r.hash,[]);by.get(r.hash).push(r)}return [...by.entries()].map(([hash,a])=>({hash,photos:a,items:uniq(a.map(x=>x.item))})).filter(g=>g.photos.length>1&&g.items.length>1)}
async function scanCurrent(){setStatus('Scanning current project…');const records=readRecords(),refs=refsOf(records),rows=await photoRowsWithHashes(),ids=new Set(rows.map(x=>x.id)),missing=[...refs.entries()].filter(([id])=>!ids.has(id)).map(([id,item])=>({id,item})),orphan=rows.filter(x=>!refs.has(x.id));lastReport={type:'device',created:new Date().toISOString(),projectId:activeId(),records:Object.keys(records).length,referencedPhotos:refs.size,storedPhotos:rows.length,missingReferences:missing,orphanPhotos:orphan,duplicateImageGroups:duplicateGroups(rows),photos:rows};$('results').innerHTML=`<div class="card"><h2>Current Project Scan</h2><div class="result">Records: ${lastReport.records}\nReferenced photos: ${lastReport.referencedPhotos}\nStored photos on device: ${rows.length}\nMissing references: ${missing.length}\nUnlinked relative to this project: ${orphan.length}\nRepeated-image groups: ${lastReport.duplicateImageGroups.length}</div></div>`;setStatus('Current-project scan complete. No data was changed.')}
function discoverProjects(){const saved=readJson(PROJECTS_KEY,[]),map=new Map();if(Array.isArray(saved))for(const p of saved)if(p?.id)map.set(String(p.id),{id:String(p.id),name:p.name||'Unnamed Project',cloudId:p.cloudId||''});map.set('legacy',map.get('legacy')||{id:'legacy',name:'Legacy / Earlier FieldVerify Data',cloudId:''});for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'',m=k.match(/^fieldVerifyProjectRecords:(.+)$/);if(m&&!map.has(m[1]))map.set(m[1],{id:m[1],name:'Recovered local project',cloudId:''})}return [...map.values()]}
async function scanAll(){setStatus('Discovering every local project…');const projects=discoverProjects(),rows=await photoRowsWithHashes(),storedIds=new Set(rows.map(x=>x.id)),allRefs=new Map(),results=[];for(let i=0;i<projects.length;i++){const p=projects[i],records=readRecords(p.id),refs=refsOf(records),missing=[...refs.entries()].filter(([id])=>!storedIds.has(id)).map(([id,item])=>({id,item})),found=[...refs.keys()].filter(id=>storedIds.has(id));for(const [id,item] of refs){if(!allRefs.has(id))allRefs.set(id,[]);allRefs.get(id).push({projectId:p.id,projectName:p.name,item})}results.push({id:p.id,name:p.name,cloudId:p.cloudId,records:Object.keys(records).length,referencedPhotos:refs.size,foundOnDevice:found.length,missingReferences:missing});setStatus(`Scanning projects… ${i+1} of ${projects.length}`)}const trulyUnlinked=rows.filter(r=>!allRefs.has(r.id)),sharedRefs=[...allRefs.entries()].filter(([,a])=>uniq(a.map(x=>x.projectId)).length>1).map(([id,a])=>({id,links:a})),dups=duplicateGroups(rows),pidCounts={};for(const r of rows)pidCounts[r.projectId]=(pidCounts[r.projectId]||0)+1;lastReport={type:'all-projects',created:new Date().toISOString(),activeProjectId:activeId(),projectCount:results.length,projects:results,storedPhotos:rows.length,uniqueStoredImageHashes:uniq(rows.map(x=>x.hash).filter(Boolean)).length,referencedByAnyProject:[...allRefs.keys()].filter(id=>storedIds.has(id)).length,trulyUnlinkedPhotos:trulyUnlinked,photoIdsReferencedByMultipleProjects:sharedRefs,duplicateImageGroups:dups,photoProjectIdCounts:pidCounts,photos:rows};$('results').innerHTML=`<div class="card"><h2>All Projects Scan</h2><div class="result">Projects found: ${results.length}\nStored photo rows: ${rows.length}\nUnique image hashes: ${lastReport.uniqueStoredImageHashes}\nStored photos referenced by at least one project: ${lastReport.referencedByAnyProject}\nTruly unlinked across ALL projects: ${trulyUnlinked.length}\nPhoto IDs referenced by multiple projects: ${sharedRefs.length}\nRepeated-image groups: ${dups.length}</div></div><div class="card"><h2>Project-by-Project</h2>${results.map(p=>`<div class="proj"><b>${p.name}</b><br><span class="small">${p.id}</span><br>Records ${p.records} · photo refs ${p.referencedPhotos} · found on device ${p.foundOnDevice} · <span class="${p.missingReferences.length?'warn':''}">missing ${p.missingReferences.length}</span></div>`).join('')}</div>`;setStatus('All-project scan complete. No data was changed. Export this report and send it to ChatGPT.')}
async function analyzeFiles(files){setStatus(`Analyzing ${files.length} backup file(s)…`);const out=[];for(const f of files){let data;try{data=JSON.parse(await f.text())}catch(e){out.push({name:f.name,status:'UNREADABLE',error:String(e.message||e)});continue}const records=data.records&&typeof data.records==='object'?data.records:{},refs=refsOf(records),photos=Array.isArray(data.photos)?data.photos:[],by=new Map(),embedded=new Set();for(const p of photos){if(!p?.id||!p?.data)continue;embedded.add(String(p.id));const blob=decodeDataUrl(p.data),hash=await hashBlob(blob),item=String(photoItem(p)??refs.get(String(p.id))??'');if(hash){if(!by.has(hash))by.set(hash,[]);by.get(hash).push({id:String(p.id),item})}}const duplicate=[...by.entries()].map(([hash,a])=>({hash,ids:a.map(x=>x.id),items:uniq(a.map(x=>x.item))})).filter(g=>g.ids.length>1&&g.items.length>1),missing=[...refs.keys()].filter(id=>!embedded.has(id));let status='SAFE PHOTO SOURCE';if(!photos.length)status='RECORDS ONLY';else if(duplicate.length)status='SUSPECT REPEATED IMAGES';else if(missing.length)status='PARTIAL PHOTO SOURCE';out.push({name:f.name,status,recordCount:Object.keys(records).length,photoReferences:refs.size,embeddedPhotos:embedded.size,missingEmbedded:missing.length,duplicateImageGroups:duplicate.length})}lastReport={type:'backup-analysis',created:new Date().toISOString(),files:out};$('results').innerHTML=`<div class="card"><h2>Backup Analysis</h2>${out.map(x=>`<div class="notice ${x.status==='SAFE PHOTO SOURCE'?'ok':x.status.includes('SUSPECT')?'bad':''}"><b>${x.name}</b><br>${x.status}<br><span class="small">Records ${x.recordCount||0} · refs ${x.photoReferences||0} · embedded ${x.embeddedPhotos||0} · missing ${x.missingEmbedded||0} · repeated groups ${x.duplicateImageGroups||0}</span></div>`).join('')}</div>`;setStatus('Backup analysis complete. No data was changed.')}
async function safeRecover(files){setStatus(`Preparing safe recovery from ${files.length} file(s)…`);const records=readRecords(),parsed=[];for(const f of files){try{parsed.push({name:f.name,data:JSON.parse(await f.text())})}catch{}}const candidates=[],by=new Map();for(const src of parsed){const recs=src.data.records&&typeof src.data.records==='object'?src.data.records:{},refs=refsOf(recs);for(const p of (Array.isArray(src.data.photos)?src.data.photos:[])){if(!p?.id||!p?.data)continue;const blob=decodeDataUrl(p.data),hash=await hashBlob(blob),id=String(p.id),item=String(photoItem(p)??refs.get(id)??''),c={p,blob,hash,id,item};candidates.push(c);if(hash){if(!by.has(hash))by.set(hash,[]);by.get(hash).push(c)}}}const suspect=new Set();for(const a of by.values())if(a.length>1&&uniq(a.map(x=>x.item)).length>1)for(const c of a)suspect.add(c.id);const db=await openDB();let saved=0,skipped=0,conflicts=0,suspectSkipped=0;for(const c of candidates){if(suspect.has(c.id)){suspectSkipped++;continue}const rt=db.transaction('photos','readonly'),existing=await req(rt.objectStore('photos').get(c.id));await done(rt).catch(()=>{});if(existing?.blob){const oldHash=await hashBlob(existing.blob);if(oldHash===c.hash)skipped++;else conflicts++;continue}const row={...c.p,blob:c.blob,projectId:c.p.projectId??activeId()};delete row.data;const wt=db.transaction('photos','readwrite'),finish=done(wt);await req(wt.objectStore('photos').put(row));await finish;saved++;if(c.item&&records[c.item]){const before=uniq(records[c.item].photos);if(!before.includes(c.id))records[c.item]={...records[c.item],photos:[...before,c.id]}}}writeRecords(records);lastReport={type:'safe-recovery',created:new Date().toISOString(),saved,skipped,conflicts,suspectSkipped};$('results').innerHTML=`<div class="card"><h2>Safe Recovery Result</h2><div class="result">Photos added: ${saved}\nAlready present: ${skipped}\nConflicting IDs blocked: ${conflicts}\nSuspicious repeated-image IDs skipped: ${suspectSkipped}</div></div>`;setStatus('Safe recovery finished. Existing records and photo blobs were not overwritten.')}
function exportReport(){if(!lastReport){setStatus('Run a scan or analysis first.');return}const name=`FieldVerify-Recovery-Report-${new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)}.json`,blob=new Blob([JSON.stringify(lastReport,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}const input=$('files');$('scan').onclick=()=>scanCurrent().catch(e=>setStatus(`Scan failed: ${e.message||e}`));$('scanAll').onclick=()=>scanAll().catch(e=>setStatus(`All-project scan failed: ${e.message||e}`));$('analyze').onclick=()=>{input.dataset.mode='analyze';input.value='';input.click()};$('recover').onclick=()=>{input.dataset.mode='recover';input.value='';input.click()};input.onchange=()=>{const files=[...(input.files||[])];if(!files.length)return;(input.dataset.mode==='recover'?safeRecover(files):analyzeFiles(files)).catch(e=>setStatus(`Operation failed: ${e.message||e}`))};$('export').onclick=exportReport;$('back').onclick=()=>location.href='./';</script></body></html>
