<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Foundation Report App</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#15202b;background:#eef2f6}*{box-sizing:border-box}body{margin:0}.top{background:#083a73;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;opacity:.9}.wrap{max-width:900px;margin:auto;padding:16px;display:grid;gap:12px}.card{background:#fff;border:1px solid #d5dde6;border-radius:16px;padding:16px}.filebox{display:block;border:3px dashed #0b67c2;border-radius:14px;padding:24px 14px;text-align:center;background:#eef6ff;font-weight:900;font-size:18px;color:#083a73}.filebox input{display:block;width:100%;margin-top:14px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:15px 16px;font-size:18px;font-weight:900;background:#b42318;color:#fff}.btn:disabled{opacity:.45}.status{line-height:1.45;margin-top:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:#eef3f8;border-radius:12px;padding:12px;text-align:center}.metric b{display:block;font-size:24px;color:#083a73}.metric span{font-size:12px;color:#61707d}.hidden{display:none!important}.report{max-width:900px;margin:0 auto 40px;background:#fff}.cover{min-height:92vh;padding:60px 42px;background:#083a73;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.cover h1{font-size:34px;margin:0 0 12px}.cover h2{font-size:22px;margin:0 0 30px}.stats{display:flex;gap:40px;margin-top:25px}.stats b{display:block;font-size:34px}.item{break-before:page;padding:30px 34px}.item h2{color:#083a73}.details{width:100%;border-collapse:collapse}.details th,.details td{border:1px solid #aeb8c3;padding:8px;text-align:left;vertical-align:top}.details th{width:180px;background:#eef3f8}.notes{white-space:pre-wrap;border:1px solid #cbd4dd;border-radius:10px;padding:12px;min-height:55px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px}.photo{margin:0;border:1px solid #cbd4dd;border-radius:10px;padding:8px;break-inside:avoid}.photo img{display:block;width:100%;max-height:520px;object-fit:contain;background:#f3f5f7}.photo figcaption{font-size:12px;margin-top:6px;color:#4f5b66}.warn{background:#fff4cc;border:1px solid #e0b93f;border-radius:10px;padding:10px}@media(max-width:650px){.summary{grid-template-columns:1fr}.photos{grid-template-columns:1fr}.cover{min-height:auto;padding:50px 22px}.stats{gap:20px}.item{padding:24px 16px}}@media print{.top,.wrap{display:none!important}.report{max-width:none;margin:0}.cover{min-height:100vh}.item{padding:22mm 14mm}.photo img{max-height:220mm}}</style></head><body><header class="top"><h1>Foundation Report App</h1><p>Select any backup JSON. This app uses every saved record and every embedded photo, regardless of date.</p></header><main class="wrap"><section class="card"><label class="filebox">SELECT FOUNDATION BACKUP JSON<input id="file" type="file" accept=".json,application/json"></label><div id="status" class="status">No file selected.</div><div id="summary" class="summary hidden"></div></section><section class="card"><button id="print" class="btn" disabled>CREATE PDF / SHARE</button></section></main><div id="report" class="report hidden"></div><script>(()=>{const file=document.getElementById('file'),print=document.getElementById('print'),status=document.getElementById('status'),summary=document.getElementById('summary'),report=document.getElementById('report');let loaded=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":'&#039;'}[c]));const fmt=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()};const meaningful=r=>r&&(r.pickupTime||r.unloadTime||r.updated||r.notes||(r.status&&r.status!=='No information')||r.inspection||r.lat!=null||r.lon!=null||(r.photos||[]).length);const photoData=p=>p?.data||p?.dataUrl||p?.url||((typeof p?.blob==='string'&&p.blob.startsWith('data:'))?p.blob:null);function normalize(raw){const records=(raw.records&&typeof raw.records==='object')?raw.records:(raw.localStorage?.foundationInspectorRecords&&typeof raw.localStorage.foundationInspectorRecords==='object')?raw.localStorage.foundationInspectorRecords:(raw.foundationInspectorRecords&&typeof raw.foundationInspectorRecords==='object')?raw.foundationInspectorRecords:{};return{records,photos:Array.isArray(raw.photos)?raw.photos:[],ncrRows:Array.isArray(raw.ncrRows)?raw.ncrRows:[],projectName:raw.projectName||raw.project?.name||'Foundation Inspection Project',created:raw.created||raw.exported||raw.date||null}}function inspectionRows(o){if(!o||typeof o!=='object')return'<tr><th>Inspection</th><td>Not recorded</td></tr>';return Object.entries(o).map(([k,v])=>`<tr><th>${esc(k.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase()))}</th><td>${esc(v||'—')}</td></tr>`).join('')}function build(data){const byId=new Map(data.photos.map(p=>[String(p.id),p])),linked=new Set(),entries=Object.entries(data.records).filter(([,r])=>meaningful(r)).sort((a,b)=>String(a[0]).localeCompare(String(b[0]),undefined,{numeric:true}));let embedded=0;const sections=[];for(const[id,r]of entries){const pics=(Array.isArray(r.photos)?r.photos:[]).map(x=>byId.get(String(x))).filter(Boolean);pics.forEach(p=>linked.add(String(p.id)));const imgs=pics.map((p,i)=>{const src=photoData(p);if(!src)return`<figure class="photo"><div class="warn">Photo record exists but image data is missing.</div><figcaption>${esc(p.name||'Saved photo')}</figcaption></figure>`;embedded++;return`<figure class="photo"><img src="${src}"><figcaption>${esc(p.name||`Photo ${i+1}`)}${p.date?` — ${esc(fmt(p.date))}`:''}</figcaption></figure>`}).join('');sections.push(`<section class="item"><h2>${esc(r.itemLabel||`${r.itemType||'Caisson'} ${id}`)}</h2><p><b>Status:</b> ${esc(r.status||'No information')}</p><table class="details"><tr><th>Record ID</th><td>${esc(id)}</td></tr><tr><th>Started</th><td>${esc(fmt(r.pickupTime))}</td></tr><tr><th>Completed</th><td>${esc(fmt(r.unloadTime))}</td></tr><tr><th>Updated</th><td>${esc(fmt(r.updated))}</td></tr><tr><th>Latitude</th><td>${esc(r.lat??r.unloadGPS?.lat??r.pickupGPS?.lat??'—')}</td></tr><tr><th>Longitude</th><td>${esc(r.lon??r.unloadGPS?.lon??r.pickupGPS?.lon??'—')}</td></tr>${inspectionRows(r.inspection)}</table><h3>Field Notes</h3><div class="notes">${esc(r.notes||'No field notes entered.')}</div><h3>Photos</h3><div class="photos">${imgs||'<div class="warn">No photos attached.</div>'}</div></section>`)}const extra=data.photos.filter(p=>!linked.has(String(p.id)));const extraHtml=extra.length?`<section class="item"><h2>Additional Saved Photos</h2><div class="photos">${extra.map((p,i)=>{const src=photoData(p);if(src)embedded++;return src?`<figure class="photo"><img src="${src}"><figcaption>${esc(p.name||`Additional Photo ${i+1}`)}</figcaption></figure>`:`<div class="warn">Additional photo data missing.</div>`}).join('')}</div></section>`:'';report.innerHTML=`<section class="cover"><h1>Foundation Inspection Report</h1><h2>${esc(data.projectName)}</h2><div>${data.created?`Backup created: ${esc(fmt(data.created))}`:`Report created: ${esc(new Date().toLocaleString())}`}</div><div class="stats"><div><b>${entries.length}</b><span>records</span></div><div><b>${embedded}</b><span>photos</span></div><div><b>${data.ncrRows.length}</b><span>NCR rows</span></div></div></section>${sections.join('')}${extraHtml}`;return{records:entries.length,photos:embedded,ncr:data.ncrRows.length}}file.addEventListener('change',async()=>{const f=file.files?.[0];if(!f)return;status.textContent='Reading backup file…';print.disabled=true;report.classList.add('hidden');try{loaded=normalize(JSON.parse(await f.text()));const c=build(loaded);status.innerHTML=`Loaded <b>${esc(f.name)}</b>.`;summary.innerHTML=`<div class="metric"><b>${c.records}</b><span>records</span></div><div class="metric"><b>${c.photos}</b><span>photos ready</span></div><div class="metric"><b>${c.ncr}</b><span>NCR rows</span></div>`;summary.classList.remove('hidden');print.disabled=false}catch(e){loaded=null;summary.classList.add('hidden');status.innerHTML=`<b>Could not open JSON.</b><br>${esc(e.message||e)}`}});print.addEventListener('click',async()=>{if(!loaded)return;report.classList.remove('hidden');status.textContent='Preparing report…';await Promise.all([...report.querySelectorAll('img')].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r})));window.print()})})();</script></body></html>
