<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Send Foundation Report</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f6;color:#15202b}.top{background:#083a73;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}.wrap{padding:18px;max-width:700px;margin:auto}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 14px #0002}.send{width:100%;border:0;border-radius:15px;padding:22px 16px;font-size:22px;font-weight:900;background:#b42318;color:#fff}.send:disabled{opacity:.55}.status{margin-top:14px;line-height:1.45}.bad{color:#a11;font-weight:800}</style></head><body><header class="top"><h1>Send Foundation Report</h1><p>Everything saved on this phone, including pictures.</p></header><main class="wrap"><section class="card"><button id="send" class="send">SEND EVERYTHING WITH PICTURES</button><div id="status" class="status">Ready.</div></section></main><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>(function(){const b=document.getElementById('send'),s=document.getElementById('status');function records(){let out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k==='foundationInspectorRecords'||k==='ordCaissonRecords'||(k&&k.startsWith('fieldVerifyProjectRecords:'))){try{Object.assign(out,JSON.parse(localStorage.getItem(k)||'{}'))}catch{}}}return out}function db(){return new Promise((res,rej)=>{const q=indexedDB.open('ordCaissonPhotos',3);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}function get(st,id){return new Promise(r=>{const q=st.get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}async function jpg(blob){const u=URL.createObjectURL(blob);try{const img=await new Promise((r,j)=>{const x=new Image();x.onload=()=>r(x);x.onerror=()=>j(Error('Photo could not open'));x.src=u});const scale=Math.min(1,1500/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const bl=await new Promise((r,j)=>c.toBlob(x=>x?r(x):j(Error('Photo conversion failed')),'image/jpeg',.82));return new Uint8Array(await bl.arrayBuffer())}finally{URL.revokeObjectURL(u)}}async function run(){if(!window.PDFLib)throw Error('PDF engine did not load. Make sure the phone is online and reopen this page.');const rec=records(),items=Object.entries(rec).filter(([,r])=>r&&(r.status||r.updated||r.notes||r.pickupTime||r.unloadTime||(r.photos||[]).length));if(!items.length)throw Error('No saved inspection records were found on this phone.');const d=await db(),st=d.transaction('photos').objectStore('photos'),{PDFDocument,StandardFonts,rgb}=PDFLib,p=await PDFDocument.create(),f=await p.embedFont(StandardFonts.Helvetica),fb=await p.embedFont(StandardFonts.HelveticaBold);let cover=p.addPage([612,792]);cover.drawRectangle({x:0,y:0,width:612,height:792,color:rgb(.03,.23,.45)});cover.drawText('Foundation Inspection Report',{x:58,y:470,size:25,font:fb,color:rgb(1,1,1)});cover.drawText(new Date().toLocaleString(),{x:58,y:440,size:12,font:f,color:rgb(1,1,1)});cover.drawText(items.length+' saved records',{x:58,y:417,size:12,font:f,color:rgb(1,1,1)});let pics=0,missing=0;for(let n=0;n<items.length;n++){const [id,r]=items[n];s.textContent='Building record '+(n+1)+' of '+items.length+'...';let pg=p.addPage([612,792]),y=746;const put=(t,size=10,bold=false)=>{String(t??'-').match(/.{1,80}(?:\s|$)/g)?.forEach(line=>{if(y<55){pg=p.addPage([612,792]);y=746}pg.drawText(line.trim(),{x:42,y,size,font:bold?fb:f,color:rgb(.04,.12,.2)});y-=size+5})};const label=(r.itemLabel||((r.itemType||'Caisson')+' '+id));put(label,17,true);put('Status: '+(r.status||'No information'));put('Started: '+(r.pickupTime?new Date(r.pickupTime).toLocaleString():'-'));put('Completed: '+(r.unloadTime?new Date(r.unloadTime).toLocaleString():'-'));put('GPS: '+(r.lat!=null&&r.lon!=null?r.lat+', '+r.lon:'Not saved'));y-=8;put('Field Notes',12,true);put(r.notes||'No field notes entered.');for(let i=0;i<(r.photos||[]).length;i++){const ph=await get(st,r.photos[i]);if(!ph||!ph.blob){missing++;continue}try{const im=await p.embedJpg(await jpg(ph.blob)),dm=im.scale(Math.min(520/im.width,620/im.height,1)),pp=p.addPage([612,792]);pp.drawText(label+' - Picture '+(i+1),{x:42,y:750,size:11,font:fb,color:rgb(.04,.12,.2)});pp.drawImage(im,{x:(612-dm.width)/2,y:80+(640-dm.height)/2,width:dm.width,height:dm.height});pics++}catch{missing++}}}const bytes=await p.save(),blob=new Blob([bytes],{type:'application/pdf'}),name='Foundation-Inspection-Report-'+new Date().toISOString().slice(0,10)+'.pdf',file=new File([blob],name,{type:'application/pdf'});s.textContent='Report ready: '+items.length+' records, '+pics+' pictures'+(missing?', '+missing+' missing':'')+'.';if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'Foundation Inspection Report',files:[file]})}else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}}b.onclick=async()=>{b.disabled=true;try{await run()}catch(e){s.innerHTML='<span class="bad">'+String(e.message||e)+'</span>'}finally{b.disabled=false}}})();</script></body></html>
