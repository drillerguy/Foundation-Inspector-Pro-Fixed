<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FieldVerify Recovery Center</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16202a;background:#eef2f6}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:760px;margin:auto}.top{background:#083a73;color:#fff;padding:16px;border-radius:16px;margin-bottom:12px}.top h1{margin:0 0 4px;font-size:24px}.card{background:#fff;border:1px solid #d7dee7;border-radius:16px;padding:14px;margin:10px 0}.notice{background:#fff4cc;border:1px solid #e5c04b;border-radius:12px;padding:10px;margin:10px 0}.ok{background:#e7f7ec;border-color:#a9d6b5}.bad{background:#fdecec;border-color:#e3abab}button{width:100%;padding:15px;margin:6px 0;border:0;border-radius:12px;font-weight:900;font-size:17px}.blue{background:#083a73;color:#fff}.green{background:#16803d;color:#fff}.gray{background:#e7edf4;color:#16202a}.purple{background:#7b3fc6;color:#fff}.small{font-size:12px;color:#66717c}.result{white-space:pre-wrap;font-size:13px;line-height:1.45}.hidden{display:none}</style></head><body><div class="wrap">
<div class="top"><h1>FieldVerify Data Recovery</h1><div>v10.25.67 Recovery Center</div></div>
<div class="notice"><b>Safe mode:</b> scanning and analysis are read-only. Safe photo recovery only adds a missing photo when no photo with that ID already exists. It does not replace status, GPS, notes, history, or an existing photo.</div>
<div class="card"><button id="scan" class="blue">SCAN THIS DEVICE</button><button id="analyze" class="gray">ANALYZE BACKUP JSON FILES</button><button id="recover" class="green">RECOVER SAFE PHOTOS FROM JSON</button><button id="export" class="gray">EXPORT RECOVERY REPORT</button><button id="back" class="purple">BACK TO FIELDVERIFY</button><input id="files" class="hidden" type="file" accept="application/json,.json" multiple></div>
<div id="status" class="card"><b>Ready.</b><div class="small">Start with Scan This Device.</div></div><div id="results"></div>
</div><script>
'use strict';
const ACTIVE_KEY='fieldVerifyActiveProject', LEGACY_KEY='foundationInspectorRecords';
let lastReport=null;
const $=id=>document.getElementById(id), uniq=a=>[...new Set((a||[]).filter(Boolean).map(String))];
function activeId(){return localStorage.getItem(ACTIVE_KEY)||'legacy'}
function recordKey(){const id=activeId();return id==='legacy'?LEGACY_KEY:`fieldVerifyProjectRecords:${id}`}
function readRecords(){try{const v=JSON.parse(localStorage.getItem(recordKey())||'{}');return v&&typeof v==='object'?v:{}}catch{return{}}}
function writeRecords(v){localStorage.setItem(recordKey(),JSON.stringify(v))}
function refsOf(records){const m=new Map();for(const [n,r] of Object.entries(records||{}))for(const id of uniq(r?.photos))m.set(id,String(n));return m}
function req(q){return new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error||Error('IndexedDB request failed'))})}
function done(tx){return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error||Error('IndexedDB transaction failed'));tx.onabort=()=>rej(tx.error||Error('IndexedDB transaction aborted'))})}
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('ordCaissonPhotos',3);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('photos'))q.result.createObjectStore('photos',{keyPath:'id'});if(!q.result.objectStoreNames.contains('ncrPdfs'))q.result.createObjectStore('ncrPdfs',{keyPath:'id'});if(!q.result.objectStoreNames.contains('settings'))q.result.createObjectStore('settings',{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function setStatus(t){$('status').innerHTML=`<b>${t}</b>`}
function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function hashBlob(blob){if(!blob||!blob.size)return'';return hex(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))}
function decodeDataUrl(value){const m=String(value||'').match(/^data:([^;,]+)?(;base64)?,(.*)$/s);if(!m)throw Error('Invalid photo data');const type=m[1]||'image/jpeg',body=m[3]||'';if(m[2]){const bin=atob(body.replace(/\s/g,'')),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type})}return new Blob([decodeURIComponent(body)],{type})}
function photoItem(p){return p?.caisson??p?.number??p?.itemNumber??p?.item??p?.item_key??null}
async function allPhotoRows(){const db=await openDB(),tx=db.transaction('photos','readonly'),store=tx.objectStore('photos'),rows=[];await new Promise((res,rej)=>{const q=store.openCursor();q.onerror=()=>rej(q.error);q.onsuccess=()=>{const c=q.result;if(!c){res();return}rows.push(c.value||{});c.continue()}});await done(tx).catch(()=>{});return rows}
function renderDevice(r){$('results').innerHTML=`<div class="card"><h2>Device Recovery Scan</h2><div class="result">Project: ${r.projectId}\nRecords: ${r.records}\nReferenced photos: ${r.referencedPhotos}\nStored photos checked: ${r.storedPhotos}\nMissing references: ${r.missingReferences.length}\nUnlinked/orphan photos: ${r.orphanPhotos.length}\nRepeated-image groups across different items: ${r.duplicateImageGroups.length}</div></div>`}
async function scanDevice(){setStatus('Scanning this device…');const records=readRecords(),refs=refsOf(records),raw=await allPhotoRows(),rows=[],ids=new Set(),byHash=new Map();for(let i=0;i<raw.length;i++){const p=raw[i],id=String(p.id||''),hash=await hashBlob(p.blob),item=String(photoItem(p)??refs.get(id)??'');ids.add(id);const row={id,item,projectId:String(p.projectId??''),bytes:Number(p.blob?.size||0),hash};rows.push(row);if(hash){if(!byHash.has(hash))byHash.set(hash,[]);byHash.get(hash).push(row)}if(i%10===9)setStatus(`Scanning this device… ${i+1} photos checked`)}const missing=[...refs.entries()].filter(([id])=>!ids.has(id)).map(([id,item])=>({id,item})),orphan=rows.filter(x=>!refs.has(x.id)),duplicate=[...byHash.entries()].map(([hash,a])=>({hash,photos:a,items:uniq(a.map(x=>x.item))})).filter(g=>g.photos.length>1&&g.items.length>1);lastReport={type:'device',created:new Date().toISOString(),projectId:activeId(),records:Object.keys(records).length,referencedPhotos:refs.size,storedPhotos:rows.length,missingReferences:missing,orphanPhotos:orphan,duplicateImageGroups:duplicate,photos:rows};renderDevice(lastReport);setStatus('Device scan complete. No data was changed.')}
async function analyzeFiles(files){setStatus(`Analyzing ${files.length} backup file(s)…`);const out=[];for(const f of files){let data;try{data=JSON.parse(await f.text())}catch(e){out.push({name:f.name,status:'UNREADABLE',error:String(e.message||e)});continue}const records=data.records&&typeof data.records==='object'?data.records:{},refs=refsOf(records),photos=Array.isArray(data.photos)?data.photos:[],byHash=new Map(),embedded=new Set();for(const p of photos){if(!p?.id||!p?.data)continue;embedded.add(String(p.id));const blob=decodeDataUrl(p.data),hash=await hashBlob(blob),item=String(photoItem(p)??refs.get(String(p.id))??'');if(hash){if(!byHash.has(hash))byHash.set(hash,[]);byHash.get(hash).push({id:String(p.id),item})}}const duplicate=[...byHash.entries()].map(([hash,a])=>({hash,ids:a.map(x=>x.id),items:uniq(a.map(x=>x.item))})).filter(g=>g.ids.length>1&&g.items.length>1),missing=[...refs.keys()].filter(id=>!embedded.has(id));let status='SAFE PHOTO SOURCE';if(!photos.length)status='RECORDS ONLY';else if(duplicate.length)status='SUSPECT REPEATED IMAGES';else if(missing.length)status='PARTIAL PHOTO SOURCE';out.push({name:f.name,status,recordCount:Object.keys(records).length,photoReferences:refs.size,embeddedPhotos:embedded.size,missingEmbedded:missing.length,duplicateImageGroups:duplicate.length})}lastReport={type:'backup-analysis',created:new Date().toISOString(),files:out};$('results').innerHTML=`<div class="card"><h2>Backup Analysis</h2>${out.map(x=>`<div class="notice ${x.status==='SAFE PHOTO SOURCE'?'ok':x.status.includes('SUSPECT')?'bad':''}"><b>${x.name}</b><br>${x.status}<br><span class="small">Records ${x.recordCount||0} · refs ${x.photoReferences||0} · embedded ${x.embeddedPhotos||0} · missing ${x.missingEmbedded||0} · repeated groups ${x.duplicateImageGroups||0}</span></div>`).join('')}</div>`;setStatus('Backup analysis complete. No data was changed.')}
async function safeRecover(files){setStatus(`Preparing safe recovery from ${files.length} file(s)…`);const records=readRecords(),parsed=[];for(const f of files){try{parsed.push({name:f.name,data:JSON.parse(await f.text())})}catch{}}const candidates=[],hashGroups=new Map();for(const src of parsed){const recs=src.data.records&&typeof src.data.records==='object'?src.data.records:{},refs=refsOf(recs);for(const p of (Array.isArray(src.data.photos)?src.data.photos:[])){if(!p?.id||!p?.data)continue;const blob=decodeDataUrl(p.data),hash=await hashBlob(blob),id=String(p.id),item=String(photoItem(p)??refs.get(id)??'');const c={src:src.name,p,blob,hash,id,item};candidates.push(c);if(hash){if(!hashGroups.has(hash))hashGroups.set(hash,[]);hashGroups.get(hash).push(c)}}}const suspect=new Set();for(const a of hashGroups.values())if(a.length>1&&uniq(a.map(x=>x.item)).length>1)for(const c of a)suspect.add(c.id);const db=await openDB();let saved=0,skipped=0,conflicts=0,suspectSkipped=0;for(let i=0;i<candidates.length;i++){const c=candidates[i];if(suspect.has(c.id)){suspectSkipped++;continue}const rt=db.transaction('photos','readonly'),existing=await req(rt.objectStore('photos').get(c.id));await done(rt).catch(()=>{});if(existing?.blob){const oldHash=await hashBlob(existing.blob);if(oldHash===c.hash)skipped++;else conflicts++;continue}const row={...c.p,blob:c.blob,projectId:c.p.projectId??activeId()};delete row.data;const wt=db.transaction('photos','readwrite'),finish=done(wt);await req(wt.objectStore('photos').put(row));await finish;saved++;if(c.item&&records[c.item]){const before=uniq(records[c.item].photos);if(!before.includes(c.id))records[c.item]={...records[c.item],photos:[...before,c.id]}}if(i%5===4)setStatus(`Recovering safe photos… ${saved} added`)}writeRecords(records);lastReport={type:'safe-recovery',created:new Date().toISOString(),saved,skipped,conflicts,suspectSkipped};$('results').innerHTML=`<div class="card"><h2>Safe Recovery Result</h2><div class="result">Photos added: ${saved}\nAlready present: ${skipped}\nConflicting existing IDs blocked: ${conflicts}\nSuspicious repeated-image IDs skipped: ${suspectSkipped}</div></div>`;setStatus('Safe recovery finished. Existing records and existing photo blobs were not overwritten.')}
function exportReport(){if(!lastReport){setStatus('Run a scan or analysis first.');return}const name=`FieldVerify-Recovery-Report-${new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)}.json`,blob=new Blob([JSON.stringify(lastReport,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}
const input=$('files');$('scan').onclick=()=>scanDevice().catch(e=>setStatus(`Scan failed: ${e.message||e}`));$('analyze').onclick=()=>{input.dataset.mode='analyze';input.value='';input.click()};$('recover').onclick=()=>{input.dataset.mode='recover';input.value='';input.click()};input.onchange=()=>{const files=[...(input.files||[])];if(!files.length)return;(input.dataset.mode==='recover'?safeRecover(files):analyzeFiles(files)).catch(e=>setStatus(`Operation failed: ${e.message||e}`))};$('export').onclick=exportReport;$('back').onclick=()=>location.href='./';
</script></body></html>
