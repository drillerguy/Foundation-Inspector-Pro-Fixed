<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foundation Inspector Pro Beta</title>
<script src="xlsx.full.min.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15202b;background:#eef2f6}*{box-sizing:border-box}body{margin:0;background:#eef2f6}.bar{position:sticky;top:0;z-index:999;background:#083a73;color:white;padding:calc(8px + env(safe-area-inset-top)) 10px 9px;box-shadow:0 2px 10px #0005}.title{font-size:17px;font-weight:900;margin-bottom:7px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.buttons button{border:0;border-radius:10px;padding:11px 7px;font-weight:900;font-size:13px;background:white;color:#083a73}.status{font-size:11px;margin-top:6px;opacity:.9}iframe{display:block;width:100%;height:calc(100vh - 116px - env(safe-area-inset-top));border:0;background:white}.toast{position:fixed;z-index:2000;left:50%;bottom:25px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 14px;border-radius:11px;font-weight:800;max-width:90%;text-align:center}.hidden{display:none}
</style>
</head>
<body>
<div class="bar">
 <div class="title">Foundation Inspector Pro — iCloud & Excel Beta</div>
 <div class="buttons">
  <button id="save">Save to iCloud</button>
  <button id="load">Load Project</button>
  <button id="excel">Export Excel</button>
 </div>
 <div class="status" id="status">The working app below is unchanged. Backups include records and pictures.</div>
</div>
<iframe id="app" src="./index.html?v=7"></iframe>
<input id="openFile" class="hidden" type="file" accept="application/json,.json">
<div id="toast" class="toast hidden"></div>
<script>
const NEW_KEY='foundationInspectorRecords',OLD_KEY='ordCaissonRecords';
const $=id=>document.getElementById(id);
function msg(s){const t=$('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(t.x);t.x=setTimeout(()=>t.classList.add('hidden'),3000);$('status').textContent=s}
function records(){try{return{...JSON.parse(localStorage.getItem(OLD_KEY)||'{}'),...JSON.parse(localStorage.getItem(NEW_KEY)||'{}')}}catch{return{}}}
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('ordCaissonPhotos',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('photos'))q.result.createObjectStore('photos',{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function allPhotos(db){return new Promise((res,rej)=>{const q=db.transaction('photos').objectStore('photos').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function dataURLToBlob(s){const [h,b]=s.split(','),mime=(h.match(/:(.*?);/)||[])[1]||'application/octet-stream',bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
function stamp(){return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)}
async function makeBackup(){const photos=[];try{const db=await openDB();for(const p of await allPhotos(db)){photos.push({...p,blob:undefined,data:await blobToDataURL(p.blob)})}}catch(e){}return{app:'Foundation Inspector Pro',version:'8-beta',created:new Date().toISOString(),records:records(),photos}}
async function saveCloud(){try{msg('Preparing iCloud backup…');const payload=await makeBackup(),name=`Foundation-Inspector-${stamp()}.json`,file=new File([JSON.stringify(payload)],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'Foundation Inspector Backup',text:'Save this file in iCloud Drive.',files:[file]});msg('Backup ready — choose Save to Files, then iCloud Drive')}else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('Backup downloaded — move it to iCloud Drive in Files')}localStorage.setItem('foundationLastCloudSave',new Date().toISOString())}catch(e){if(e.name!=='AbortError')msg('Save failed: '+e.message)}}
async function restoreFile(file){try{msg('Loading project…');const j=JSON.parse(await file.text()),incoming=j.records||j.foundationInspectorRecords||j.localStorage?.foundationInspectorRecords;if(!incoming||typeof incoming!=='object')throw Error('No inspection records found');const merged={...records(),...incoming};localStorage.setItem(NEW_KEY,JSON.stringify(merged));if(Array.isArray(j.photos)&&j.photos.length){const db=await openDB(),tx=db.transaction('photos','readwrite'),store=tx.objectStore('photos');for(const p of j.photos)if(p.id&&p.data)store.put({...p,blob:dataURLToBlob(p.data),data:undefined});await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}msg(`Project loaded: ${Object.keys(incoming).length} records`);$('app').src='./index.html?restored='+Date.now()}catch(e){msg('Load failed: '+e.message)}}
function dateCell(v){return v?new Date(v).toLocaleString():''}
function exportExcel(){try{const recs=records(),rows=Object.entries(recs).sort((a,b)=>Number(a[0])-Number(b[0])).map(([n,r])=>({
 'Caisson Number':Number(n),'Status':r.status||'','Picked Up':dateCell(r.pickupTime),'Unloaded':dateCell(r.unloadTime),'Latitude':r.lat??'','Longitude':r.lon??'','Verified':r.verified?'Yes':'No','Notes':r.notes||'','Photo Count':Array.isArray(r.photos)?r.photos.length:0,'Last Updated':dateCell(r.updated),'Pickup GPS Accuracy (ft)':r.pickupGPS?.accuracy!=null?Math.round(r.pickupGPS.accuracy*3.28084):'','Unload GPS Accuracy (ft)':r.unloadGPS?.accuracy!=null?Math.round(r.unloadGPS.accuracy*3.28084):''
}));const unloaded=rows.filter(r=>r.Unloaded).length,picked=rows.filter(r=>r['Picked Up']&&!r.Unloaded).length,total=rows.length;const summary=[{'Project Metric':'Total saved records','Value':total},{'Project Metric':'Unloaded','Value':unloaded},{'Project Metric':'Picked up, not unloaded','Value':picked},{'Project Metric':'Other saved records','Value':Math.max(0,total-unloaded-picked)},{'Project Metric':'Completion %','Value':total?Math.round(unloaded/total*100):0},{'Project Metric':'Exported','Value':new Date().toLocaleString()}];const wb=XLSX.utils.book_new(),ws1=XLSX.utils.json_to_sheet(summary),ws2=XLSX.utils.json_to_sheet(rows);ws1['!cols']=[{wch:28},{wch:22}];ws2['!cols']=[{wch:15},{wch:18},{wch:22},{wch:22},{wch:14},{wch:14},{wch:10},{wch:40},{wch:12},{wch:22},{wch:24},{wch:24}];if(ws2['!ref'])ws2['!autofilter']={ref:ws2['!ref']};XLSX.utils.book_append_sheet(wb,ws1,'Dashboard');XLSX.utils.book_append_sheet(wb,ws2,'Inspection Data');XLSX.writeFile(wb,`Foundation-Inspector-${stamp()}.xlsx`);msg(`Excel exported: ${rows.length} records`)}catch(e){msg('Excel export failed: '+e.message)}}
$('save').onclick=saveCloud;$('load').onclick=()=>$('openFile').click();$('openFile').onchange=e=>{const f=e.target.files[0];if(f)restoreFile(f);e.target.value=''};$('excel').onclick=exportExcel;
const last=localStorage.getItem('foundationLastCloudSave');if(last)$('status').textContent='Last iCloud backup prepared: '+new Date(last).toLocaleString();
</script>
</body>
</html>
