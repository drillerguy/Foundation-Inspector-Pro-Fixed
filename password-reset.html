<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#083a73">
<title>Reset FieldVerify Password</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#15202b;background:#eef2f6}*{box-sizing:border-box}body{margin:0}.top{background:#083a73;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;opacity:.9}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d5dde6;border-radius:16px;padding:18px;box-shadow:0 3px 14px #0001}.field{width:100%;border:1px solid #c8d0d9;border-radius:11px;padding:13px;font-size:17px;margin:7px 0}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:8px;background:#083a73;color:#fff;font-size:17px;font-weight:900}.btn.green{background:#16803d}.btn.gray{background:#687480}.status{margin:10px 0;line-height:1.45}.bad{color:#a51d17;font-weight:800}.good{color:#12642f;font-weight:800}.hidden{display:none}.tiny{font-size:13px;color:#687480;line-height:1.45}
</style>
</head>
<body>
<header class="top"><h1>FieldVerify Pro</h1><p>Set a new Cloud password</p></header>
<main class="wrap"><section class="card">
<div id="status" class="status"><b>Opening secure password reset…</b></div>
<div id="form" class="hidden">
<label for="p1"><b>New password</b></label><input id="p1" class="field" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters">
<label for="p2"><b>Confirm new password</b></label><input id="p2" class="field" type="password" autocomplete="new-password" minlength="6" placeholder="Enter it again">
<button id="save" class="btn green">SAVE NEW PASSWORD</button>
</div>
<button id="back" class="btn gray">Return to FieldVerify</button>
<p class="tiny">Use only the newest reset email. Older recovery links can become invalid after another reset email is requested.</p>
</section></main>
<script type="module">
const SUPABASE_URL='https://xkjmuvrzlsgftvgvazld.supabase.co';
const SUPABASE_KEY='sb_publishable_MxI2bspqc0SmCBrqj8HVqg_IxgpKRvO';
const APP='./';
const status=document.getElementById('status'),form=document.getElementById('form'),save=document.getElementById('save');
const show=(text,kind='')=>{status.className='status '+kind;status.textContent=text};
document.getElementById('back').onclick=()=>location.href=APP;
try{
 const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
 const sb=mod.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const params=new URLSearchParams(location.hash.slice(1));
 if(params.get('error_description')) throw Error(decodeURIComponent(params.get('error_description')));
 let session=(await sb.auth.getSession()).data.session;
 if(!session){
   session=await new Promise(resolve=>{
     let done=false;
     const timer=setTimeout(()=>{if(!done){done=true;resolve(null)}},3500);
     const {data}=sb.auth.onAuthStateChange((event,s)=>{if(!done&&(event==='PASSWORD_RECOVERY'||s)){done=true;clearTimeout(timer);data.subscription.unsubscribe();resolve(s)}});
   });
 }
 if(!session) throw Error('This reset link is invalid or has expired. Return to FieldVerify and request one new reset email.');
 show('Reset link verified. Enter your new FieldVerify Cloud password below.','good');
 form.classList.remove('hidden');
 save.onclick=async()=>{
   const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
   if(p1.length<6)return show('Password must be at least 6 characters.','bad');
   if(p1!==p2)return show('The two passwords do not match.','bad');
   save.disabled=true;show('Saving your new password…');
   const r=await sb.auth.updateUser({password:p1});
   if(r.error){save.disabled=false;return show(r.error.message,'bad')}
   show('Password changed. You can now return to FieldVerify and sign in with this new password.','good');
   form.classList.add('hidden');
 };
}catch(e){show(e?.message||String(e),'bad')}
</script>
</body>
</html>
