<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FieldVerify Pro Recovery</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f6;margin:0;padding:20px;color:#15202b}.box{max-width:700px;margin:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px #0002}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;font-weight:800;background:#083a73;color:white}.warn{background:#b42318}pre{white-space:pre-wrap;background:#f3f5f7;padding:10px;border-radius:10px}</style></head>
<body><div class="box"><h1>FieldVerify Pro Recovery Tools</h1><p>Use this page only if the main app will not open correctly.</p><button onclick="location.href='./index.html?refresh='+Date.now()">Open Fresh App Page</button><button onclick="downloadRecords()">Download Records-Only Emergency Backup</button><button onclick="showCount()">Show Saved Record Count</button><button class="warn" onclick="clearCache()">Clear App Cache Only</button><pre id="out">No action taken.</pre></div>
<script>const KEY='foundationInspectorRecords';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}function showCount(){out.textContent=Object.keys(data()).length+' records found in this browser.'}function downloadRecords(){const records=data(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'FieldVerify Pro Emergency Backup',created:new Date().toISOString(),records},null,2)],{type:'application/json'}));a.download='FieldVerify-Pro-Emergency-'+new Date().toISOString().slice(0,10)+'.json';a.click();out.textContent=Object.keys(records).length+' records downloaded.'}async function clearCache(){for(const k of await caches.keys())await caches.delete(k);out.textContent='App cache cleared. Your inspection records were not deleted.'}</script></body></html>
