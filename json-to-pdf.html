<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#083a73">
<title>Foundation Report Converter</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#15202b;background:#eef2f6}*{box-sizing:border-box}body{margin:0}.top{background:#083a73;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;opacity:.85}.controls{padding:16px;display:grid;gap:12px;max-width:900px;margin:auto}.card{background:#fff;border:1px solid #d5dde6;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0000000c}.button{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;font-size:18px;font-weight:900;text-align:center;background:#083a73;color:#fff}.button.red{background:#b42318}.button.gray{background:#dfe6ee;color:#15202b}.button:disabled{opacity:.45}.file-input{position:absolute;left:-9999px}.status{font-size:15px;line-height:1.45}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:#eef3f8;border-radius:12px;padding:12px;text-align:center}.metric b{display:block;font-size:24px;color:#083a73}.metric span{font-size:12px;color:#61707d}.report{max-width:900px;margin:0 auto 40px;background:#fff}.cover{min-height:92vh;padding:60px 42px;background:#083a73;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.cover h1{font-size:34px;margin:0 0 12px}.cover h2{font-size:22px;margin:0 0 30px;font-weight:600}.cover .stats{display:flex;gap:45px;margin-top:28px}.cover .stats div b{display:block;font-size:34px}.item{break-before:page;padding:30px 34px}.item h2{margin:0;color:#083a73;font-size:26px}.item .statusline{font-weight:800;color:#16803d;margin:6px 0 16px}.details{width:100%;border-collapse:collapse;margin:14px 0}.details th,.details td{border:1px solid #aeb8c3;padding:8px;text-align:left;vertical-align:top}.details th{width:185px;background:#eef3f8}.notes{white-space:pre-wrap;border:1px solid #cbd4dd;border-radius:10px;padding:12px;min-height:55px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.photo{margin:0;border:1px solid #cbd4dd;border-radius:10px;padding:8px;break-inside:avoid}.photo img{display:block;width:100%;max-height:520px;object-fit:contain;background:#f3f5f7}.photo figcaption{font-size:12px;margin-top:6px;color:#4f5b66}.unlinked{break-before:page;padding:30px 34px}.warning{background:#fff4cc;border:1px solid #e0b93f;border-radius:10px;padding:10px;margin-top:10px}.hidden{display:none!important}@media(max-width:650px){.summary{grid-template-columns:1fr}.photos{grid-template-columns:1fr}.cover{min-height:auto;padding:50px 22px}.cover .stats{gap:25px}.item,.unlinked{padding:24px 16px}}@media print{body{background:#fff}.top,.controls{display:none!important}.report{max-width:none;margin:0}.cover{min-height:100vh}.item,.unlinked{padding:22mm 14mm}.photo img{max-height:220mm}}
</style>
</head>
<body>
<header class="top"><h1>Foundation Report Converter</h1><p>Load any Foundation Inspector JSON backup and create one PDF containing everything saved in it.</p></header>
<main class="controls" id="controls">
  <section class="card">
    <input id="jsonFile" class="file-input" type="file" accept="application/json,.json">
    <button id="chooseBtn" class="button">CHOOSE BACKUP JSON FILE</button>
    <div id="status" class="status" style="margin-top:12px">No file loaded.</div>
    <div id="summary" class="summary hidden"></div>
  </section>
  <section class="card">
    <button id="pdfBtn" class="button red" disabled>CREATE PDF / SHARE</button>
    <button id="newBtn" class="button gray hidden" style="margin-top:10px">LOAD A DIFFERENT JSON FILE</button>
    <div class="status" style="margin-top:12px">This report does not care what day the work was done. It includes every saved inspection record and every photo found in the JSON file.</div>
  </section>
</main>
<div id="report" class="report hidden"></div>
<script>
(() => {
  'use strict';
  const fileInput=document.getElementById('jsonFile');
  const chooseBtn=document.getElementById('chooseBtn');
  const pdfBtn=document.getElementById('pdfBtn');
  const newBtn=document.getElementById('newBtn');
  const status=document.getElementById('status');
  const summary=document.getElementById('summary');
  const report=document.getElementById('report');
  let loaded=null;

  const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":'&#039;'}[ch]));
  const fmt=value=>{if(!value)return'—';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleString()};
  const meaningful=r=>r&&(r.pickupTime||r.unloadTime||r.updated||r.notes||r.status&&r.status!=='No information'||r.inspection||r.lat!=null||r.lon!=null||(r.photos||[]).length);
  const photoData=p=>p?.data||p?.dataUrl||p?.url||((typeof p?.blob==='string'&&p.blob.startsWith('data:'))?p.blob:null);

  function normalize(raw){
    const records=raw.records&&typeof raw.records==='object'?raw.records:
      raw.localStorage?.foundationInspectorRecords&&typeof raw.localStorage.foundationInspectorRecords==='object'?raw.localStorage.foundationInspectorRecords:
      raw.foundationInspectorRecords&&typeof raw.foundationInspectorRecords==='object'?raw.foundationInspectorRecords:{};
    const photos=Array.isArray(raw.photos)?raw.photos:[];
    const ncrRows=Array.isArray(raw.ncrRows)?raw.ncrRows:(Array.isArray(raw.localStorage?.foundationInspectorNcrData)?raw.localStorage.foundationInspectorNcrData:[]);
    const projectName=raw.projectName||raw.project?.name||raw.metadata?.projectName||'Foundation Inspection Project';
    return {raw,records,photos,ncrRows,projectName,created:raw.created||raw.exported||raw.date||null};
  }

  function inspectionRows(inspection){
    if(!inspection||typeof inspection!=='object')return'<tr><th>Inspection</th><td>Not recorded</td></tr>';
    return Object.entries(inspection).map(([k,v])=>`<tr><th>${esc(k.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase()))}</th><td>${esc(v||'—')}</td></tr>`).join('');
  }

  function buildReport(data){
    const photoById=new Map(data.photos.map(p=>[String(p.id),p]));
    const entries=Object.entries(data.records).filter(([,r])=>meaningful(r)).sort((a,b)=>String(a[0]).localeCompare(String(b[0]),undefined,{numeric:true}));
    const linkedIds=new Set();
    let embeddedCount=0;
    const sections=[];

    for(const [id,r] of entries){
      const ids=Array.isArray(r.photos)?r.photos:[];
      const photos=ids.map(x=>photoById.get(String(x))).filter(Boolean);
      photos.forEach(p=>linkedIds.add(String(p.id)));
      const photoHtml=photos.map((p,i)=>{
        const src=photoData(p);
        if(!src)return`<figure class="photo"><div class="warning">Photo ${i+1} exists in the backup record but has no embedded image data.</div><figcaption>${esc(p.name||'Saved photo')}</figcaption></figure>`;
        embeddedCount++;
        return`<figure class="photo"><img src="${src}" alt="Photo for ${esc(id)}"><figcaption>${esc(p.name||`Photo ${i+1}`)}${p.date?` — ${esc(fmt(p.date))}`:''}</figcaption></figure>`;
      }).join('');
      sections.push(`<section class="item"><h2>${esc(r.itemLabel||r.itemType?`${r.itemType||'Caisson'} ${r.itemLabel||id}`:`Caisson ${id}`)}</h2><div class="statusline">${esc(r.status||'No information')}</div><table class="details"><tr><th>Record ID</th><td>${esc(id)}</td></tr><tr><th>Started / Pickup</th><td>${esc(fmt(r.pickupTime))}</td></tr><tr><th>Completed / Unload</th><td>${esc(fmt(r.unloadTime))}</td></tr><tr><th>Last Updated</th><td>${esc(fmt(r.updated))}</td></tr><tr><th>Latitude</th><td>${r.lat??r.unloadGPS?.lat??r.pickupGPS?.lat??'—'}</td></tr><tr><th>Longitude</th><td>${r.lon??r.unloadGPS?.lon??r.pickupGPS?.lon??'—'}</td></tr><tr><th>Photo Count</th><td>${photos.length}</td></tr>${inspectionRows(r.inspection)}</table><h3>Field Notes</h3><div class="notes">${esc(r.notes||'No field notes entered.')}</div><h3>Photos</h3><div class="photos">${photoHtml||'<div class="warning">No photos attached to this record.</div>'}</div></section>`);
    }

    const unlinked=data.photos.filter(p=>!linkedIds.has(String(p.id)));
    const unlinkedHtml=unlinked.length?`<section class="unlinked"><h2>Additional Saved Photos</h2><p>These photos were present in the JSON backup but were not linked to a specific inspection record.</p><div class="photos">${unlinked.map((p,i)=>{const src=photoData(p);if(src)embeddedCount++;return src?`<figure class="photo"><img src="${src}" alt="Additional saved photo"><figcaption>${esc(p.name||`Additional Photo ${i+1}`)}${p.date?` — ${esc(fmt(p.date))}`:''}</figcaption></figure>`:`<figure class="photo"><div class="warning">Image data missing.</div><figcaption>${esc(p.name||`Additional Photo ${i+1}`)}</figcaption></figure>`}).join('')}</div></section>`:'';

    report.innerHTML=`<section class="cover"><h1>Foundation Inspection Report</h1><h2>${esc(data.projectName)}</h2><div>${data.created?`Backup created: ${esc(fmt(data.created))}`:`Report created: ${esc(new Date().toLocaleString())}`}</div><div class="stats"><div><b>${entries.length}</b><span>Saved inspection records</span></div><div><b>${embeddedCount}</b><span>Embedded photos</span></div><div><b>${data.ncrRows.length}</b><span>NCR rows</span></div></div></section>${sections.join('')}${unlinkedHtml}`;
    return {recordCount:entries.length,photoCount:data.photos.length,embeddedCount,ncrCount:data.ncrRows.length};
  }

  async function loadFile(file){
    status.textContent='Reading backup file…';
    pdfBtn.disabled=true;
    report.classList.add('hidden');
    try{
      const text=await file.text();
      const raw=JSON.parse(text);
      loaded=normalize(raw);
      const counts=buildReport(loaded);
      status.innerHTML=`Loaded <b>${esc(file.name)}</b>. The report includes all saved data in this file, regardless of date.`;
      summary.innerHTML=`<div class="metric"><b>${counts.recordCount}</b><span>records</span></div><div class="metric"><b>${counts.embeddedCount}</b><span>photos ready</span></div><div class="metric"><b>${counts.ncrCount}</b><span>NCR rows</span></div>`;
      summary.classList.remove('hidden');
      pdfBtn.disabled=false;
      newBtn.classList.remove('hidden');
      chooseBtn.textContent='BACKUP JSON LOADED';
    }catch(error){
      loaded=null;
      summary.classList.add('hidden');
      status.innerHTML=`<b>Could not open this JSON file.</b><br>${esc(error.message||error)}`;
      chooseBtn.textContent='CHOOSE BACKUP JSON FILE';
    }
  }

  chooseBtn.onclick=()=>fileInput.click();
  newBtn.onclick=()=>fileInput.click();
  fileInput.onchange=()=>{const file=fileInput.files?.[0];if(file)loadFile(file)};
  pdfBtn.onclick=async()=>{
    if(!loaded)return;
    report.classList.remove('hidden');
    status.textContent='Report ready. The iPhone print screen will open next.';
    await Promise.all([...report.querySelectorAll('img')].map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=img.onerror=resolve})));
    setTimeout(()=>window.print(),150);
  };
})();
</script>
</body>
</html>
