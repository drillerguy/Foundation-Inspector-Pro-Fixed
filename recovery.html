<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Foundation Report Sender</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#15202b;background:#eef2f6}*{box-sizing:border-box}body{margin:0}.top{background:#083a73;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;opacity:.9}.wrap{max-width:900px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:#fff;border:1px solid #d5dde6;border-radius:16px;padding:16px}.filebox{display:block;border:3px dashed #0b67c2;border-radius:14px;padding:22px 14px;text-align:center;background:#eef6ff;font-weight:900;font-size:18px;color:#083a73}.filebox input{display:block;width:100%;margin-top:14px;font-size:16px}.send{width:100%;border:0;border-radius:14px;padding:18px;font-size:21px;font-weight:900;background:#b42318;color:#fff;box-shadow:0 4px 12px #0003}.send:disabled{background:#9aa4ad;box-shadow:none}.status{line-height:1.45;margin-top:12px}.steps{font-size:15px;line-height:1.5}.hidden{display:none!important}.report{max-width:900px;margin:0 auto 40px;background:#fff}.cover{min-height:92vh;padding:60px 42px;background:#083a73;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.cover h1{font-size:34px;margin:0 0 12px}.item{break-before:page;padding:30px 34px}.item h2{color:#083a73}.details{width:100%;border-collapse:collapse}.details th,.details td{border:1px solid #aeb8c3;padding:8px;text-align:left;vertical-align:top}.details th{width:180px;background:#eef3f8}.notes{white-space:pre-wrap;border:1px solid #cbd4dd;border-radius:10px;padding:12px;min-height:55px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px}.photo{margin:0;border:1px solid #cbd4dd;border-radius:10px;padding:8px;break-inside:avoid}.photo img{display:block;width:100%;max-height:520px;object-fit:contain}.warn{background:#fff4cc;border:1px solid #e0b93f;border-radius:10px;padding:10px}@media(max-width:650px){.photos{grid-template-columns:1fr}.cover{min-height:auto;padding:50px 22px}.item{padding:24px 16px}}@media print{.top,.wrap{display:none!important}.report{max-width:none;margin:0}.cover{min-height:100vh}.item{padding:22mm 14mm}.photo img{max-height:220mm}}
</style>
</head>
<body>
<header class="top"><h1>Foundation Report Sender</h1><p>Turn any saved Foundation Inspector JSON backup into one PDF with all stored records and photos.</p></header>
<main class="wrap">
<section class="card">
<label class="filebox">1. SELECT FOUNDATION BACKUP JSON<input id="file" type="file" accept=".json,application/json"></label>
<div id="status" class="status">No backup file selected.</div>
</section>
<section class="card">
<button id="send" class="send" disabled>2. SEND PDF TO OFFICE</button>
<div class="steps" style="margin-top:12px"><b>After tapping the red button:</b> the iPhone PDF/print screen opens. Open the preview, then tap the Share icon to email or send the PDF.</div>
</section>
</main>
<div id="report" class="report hidden"></div>
<script>
(function(){
var file=document.getElementById('file');
var send=document.getElementById('send');
var status=document.getElementById('status');
var report=document.getElementById('report');
var loaded=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
function fmt(v){if(!v)return '—';var d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleString();}
function photoData(p){if(!p)return null;return p.data||p.dataUrl||p.url||(typeof p.blob==='string'&&p.blob.indexOf('data:')===0?p.blob:null);}
function normalize(raw){var records={};if(raw.records&&typeof raw.records==='object')records=raw.records;else if(raw.localStorage&&raw.localStorage.foundationInspectorRecords&&typeof raw.localStorage.foundationInspectorRecords==='object')records=raw.localStorage.foundationInspectorRecords;else if(raw.foundationInspectorRecords&&typeof raw.foundationInspectorRecords==='object')records=raw.foundationInspectorRecords;return {records:records,photos:Array.isArray(raw.photos)?raw.photos:[],projectName:raw.projectName||(raw.project&&raw.project.name)||'Foundation Inspection Project',created:raw.created||raw.exported||raw.date||null};}
function meaningful(r){return r&&(r.pickupTime||r.unloadTime||r.updated||r.notes||(r.status&&r.status!=='No information')||r.inspection||r.lat!=null||r.lon!=null||(r.photos||[]).length);}
function build(data){var byId={};data.photos.forEach(function(p){byId[String(p.id)]=p;});var entries=Object.entries(data.records).filter(function(pair){return meaningful(pair[1]);});entries.sort(function(a,b){return String(a[0]).localeCompare(String(b[0]),undefined,{numeric:true});});var html='<section class="cover"><h1>Foundation Inspection Report</h1><h2>'+esc(data.projectName)+'</h2><p>'+(data.created?'Backup created: '+esc(fmt(data.created)):'Report created: '+esc(new Date().toLocaleString()))+'</p><p>'+entries.length+' saved inspection records</p></section>';
entries.forEach(function(pair){var id=pair[0],r=pair[1]||{},photoIds=Array.isArray(r.photos)?r.photos:[],pics=photoIds.map(function(x){return byId[String(x)];}).filter(Boolean);var picHtml='';pics.forEach(function(p,i){var src=photoData(p);picHtml+=src?'<figure class="photo"><img src="'+src+'"><figcaption>'+esc(p.name||('Photo '+(i+1)))+(p.date?' — '+esc(fmt(p.date)):'')+'</figcaption></figure>':'<div class="warn">Photo record exists, but image data is missing.</div>';});html+='<section class="item"><h2>'+esc(r.itemLabel||((r.itemType||'Caisson')+' '+id))+'</h2><table class="details"><tr><th>Status</th><td>'+esc(r.status||'No information')+'</td></tr><tr><th>Started</th><td>'+esc(fmt(r.pickupTime))+'</td></tr><tr><th>Completed</th><td>'+esc(fmt(r.unloadTime))+'</td></tr><tr><th>Updated</th><td>'+esc(fmt(r.updated))+'</td></tr><tr><th>Latitude</th><td>'+esc(r.lat!=null?r.lat:'—')+'</td></tr><tr><th>Longitude</th><td>'+esc(r.lon!=null?r.lon:'—')+'</td></tr><tr><th>Photo Count</th><td>'+pics.length+'</td></tr></table><h3>Field Notes</h3><div class="notes">'+esc(r.notes||'No field notes entered.')+'</div><h3>Photos</h3><div class="photos">'+(picHtml||'<div class="warn">No photos attached to this record.</div>')+'</div></section>';});report.innerHTML=html;return entries.length;}
file.addEventListener('change',function(){var f=file.files&&file.files[0];if(!f)return;status.textContent='Reading backup file…';send.disabled=true;var reader=new FileReader();reader.onload=function(){try{loaded=normalize(JSON.parse(reader.result));var count=build(loaded);status.innerHTML='Loaded <b>'+esc(f.name)+'</b> — '+count+' saved records ready.';send.disabled=false;}catch(e){loaded=null;status.innerHTML='<b>Could not open this JSON file.</b><br>'+esc(e.message||e);}};reader.onerror=function(){status.textContent='The file could not be read.';};reader.readAsText(f);});
send.addEventListener('click',function(){if(!loaded)return;report.classList.remove('hidden');status.textContent='Opening the PDF share screen…';var imgs=Array.prototype.slice.call(report.querySelectorAll('img'));var waits=imgs.map(function(img){return img.complete?Promise.resolve():new Promise(function(resolve){img.onload=img.onerror=resolve;});});Promise.all(waits).then(function(){setTimeout(function(){window.print();},100);});});
})();
</script>
</body>
</html>
